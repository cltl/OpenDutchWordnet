function collectEditorState() {
  // Collect entry pane
  if (state.selectedId && !state.selectedGroupIds) {
    const entry = getEntry(state.selectedId);
    if (entry && !entry._indexOnly) { _collectEntryFields(entry); }
  }
  // Collect synset pane
  collectSynsetState();
}

function _collectEntryFields(entry) {

  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (v('f-id')    !== null) entry.id           = v('f-id');
  if (v('f-lemma') !== null) entry.lemma        = v('f-lemma');
  if (v('f-pos')   !== null) entry.partOfSpeech = v('f-pos');
  if (v('f-formtype') !== null) entry.formType  = v('f-formtype');
  if (v('f-lemmamode') !== null) entry.lemmaMode = v('f-lemmamode');
  if (v('f-mwe-form')  !== null) { entry.mweForm = v('f-mwe-form'); entry.mweExpressionType = v('f-mwe-type') || ''; }
  if (v('f-e-comment') !== null) entry.comment  = v('f-e-comment');

  entry.wordForms = [];
  document.querySelectorAll('.wf-row').forEach(r => {
    const wf = { writtenForm: r.querySelector('.wf-form').value, grammaticalNumber: r.querySelector('.wf-num').value, comparison: r.querySelector('.wf-comp').value, article: r.querySelector('.wf-art').value, tense: r.querySelector('.wf-tense').value };
    if (wf.writtenForm) entry.wordForms.push(wf);
  });

  entry.relatedForms = [];
  document.querySelectorAll('.rf-row').forEach(r => { const wf = r.querySelector('.rf-form').value; if (wf) entry.relatedForms.push({ writtenForm: wf, variantType: r.querySelector('.rf-type').value }); });

  if (v('f-morphtype') !== null) entry.morphology = { morphoType: v('f-morphtype'), comparisonType: v('f-comptype') || '', declinable: v('f-declinable') || '', separability: v('f-sep') || '' };

  if (v('f-ms-gender') !== null) {
    const auxEls = document.querySelectorAll('.aux-check:checked');
    entry.morphoSyntax = { pronominalAndGrammaticalGender: v('f-ms-gender'), adverbialUsage: v('f-ms-adv') || '', position: v('f-ms-pos') || '', reflexivity: v('f-ms-refl') || '', auxiliaries: [...auxEls].map(el => el.value) };
  }

  if (v('f-sb-val') !== null) {
    entry.syntacticBehaviour.valency      = v('f-sb-val');
    entry.syntacticBehaviour.transitivity = v('f-sb-trans') || '';
    entry.syntacticBehaviour.complementations = [];
    document.querySelectorAll('.comp-row').forEach(r => {
      const c = r.querySelector('.comp-compl').value;
      if (c) entry.syntacticBehaviour.complementations.push({ complement: c, preposition: r.querySelector('.comp-prep').value });
    });
  }

  entry.senses = [];
  document.querySelectorAll('.sblock').forEach(block => {
    const sense = {
      id: block.dataset.sid,
      senseId:    (block.querySelector('.s-senseid')    || {}).value || '',
      definition: (block.querySelector('.s-def')        || {}).value || '',
      synset:     (block.querySelector('.s-synset')     || {}).value || '',
      provenance: (block.querySelector('.s-prov')       || {}).value || '',
      annotator:  (block.querySelector('.s-annot')      || {}).value || '',
      senseRelations: [], semanticsNoun: null, semanticsVerb: null, semanticsAdj: null,
      pragmatics: { domains: [], chronology: '', connotation: '', geography: '', register: '' },
      examples: [], sentiment: null
    };

    block.querySelectorAll('.sr-row').forEach(r => { const t = r.querySelector('.sr-tgt').value; if (t) sense.senseRelations.push({ relationType: r.querySelector('.sr-type').value, targetSenseId: t }); });

    const snRef = block.querySelector('.sn-ref');
    if (snRef) {
      const shifts = []; block.querySelectorAll('.snshift-row').forEach(r => { const t = r.querySelector('.snshift-type').value; if (t) shifts.push({ semanticType: t }); });
      sense.semanticsNoun = { reference: snRef.value, countability: (block.querySelector('.sn-count')||{}).value||'', semanticType: (block.querySelector('.sn-semtype')||{}).value||'', semanticSubType: (block.querySelector('.sn-subtype')||{}).value||'', shifts };
    }

    const svTypes = block.querySelectorAll('.svtype-row');
    if (svTypes.length || block.querySelector('.sv-present')) {
      const types = []; svTypes.forEach(r => { const t = r.querySelector('.sv-semtype').value; if (t) types.push({ semanticType: t, semanticFeatureSet: r.querySelector('.sv-featset').value }); });
      sense.semanticsVerb = { semanticTypes: types };
    }

    const saType = block.querySelector('.sa-semtype');
    if (saType) {
      const shifts = []; block.querySelectorAll('.sashift-row').forEach(r => { const t = r.querySelector('.sashift-type').value; if (t) shifts.push({ semanticType: t }); });
      sense.semanticsAdj = { semanticType: saType.value, shifts };
    }

    block.querySelectorAll('.dom-sel').forEach(el => { if (el.value) sense.pragmatics.domains.push(el.value); });
    sense.pragmatics.chronology  = (block.querySelector('.prag-chron') ||{}).value || '';
    sense.pragmatics.connotation = (block.querySelector('.prag-conn')  ||{}).value || '';
    sense.pragmatics.geography   = (block.querySelector('.prag-geo')   ||{}).value || '';
    sense.pragmatics.register    = (block.querySelector('.prag-reg')   ||{}).value || '';

    block.querySelectorAll('.ex-row').forEach(r => {
      const tf = r.querySelector('.ex-tf').value;
      const combiWords = []; r.querySelectorAll('.ex-cw-row').forEach(cr => { const lemma = cr.querySelector('.ex-cw-lemma').value; if (lemma) combiWords.push({ lemma, partOfSpeech: cr.querySelector('.ex-cw-pos').value }); });
      const domains = []; r.querySelectorAll('.ex-dom-sel').forEach(el => { if (el.value) domains.push(el.value); });
      const canonicalForm = {
        text:           (r.querySelector('.ex-cf-text') || {}).value || '',
        phraseType:     (r.querySelector('.ex-cf-pt')   || {}).value || '',
        expressionType: (r.querySelector('.ex-cf-et')   || {}).value || ''
      };
      const semanticsEx = {
        gracolComplem:  (r.querySelector('.ex-sm-complem')  || {}).value || '',
        gracolGramword: (r.querySelector('.ex-sm-gramword') || {}).value || '',
        definition:     (r.querySelector('.ex-sm-def')      || {}).value || ''
      };
      const pragmaticsEx = {
        chronology:  (r.querySelector('.ex-pr-chron') || {}).value || '',
        connotation: (r.querySelector('.ex-pr-conn')  || {}).value || '',
        geography:   (r.querySelector('.ex-pr-geo')   || {}).value || '',
        register:    (r.querySelector('.ex-pr-reg')   || {}).value || '',
        domains
      };
      const hasContent = tf || canonicalForm.text || canonicalForm.phraseType || canonicalForm.expressionType || combiWords.length
        || semanticsEx.gracolComplem || semanticsEx.gracolGramword || semanticsEx.definition
        || pragmaticsEx.chronology || pragmaticsEx.connotation || pragmaticsEx.geography || pragmaticsEx.register || domains.length;
      if (!hasContent) return;
      sense.examples.push({
        id: r.dataset.exid || uid('ex'),
        textualForm: tf,
        phraseType: r.querySelector('.ex-pt').value,
        canonicalForm,
        combiWords,
        semanticsEx,
        pragmaticsEx
      });
    });

    const sentPol = block.querySelector('.sent-pol');
    if (sentPol) sense.sentiment = { polarity: sentPol.value, externalReference: (block.querySelector('.sent-ref')||{}).value || '' };

    entry.senses.push(sense);
  });

  state.modified = true;
}

function collectSynsetState() {
  const ss = getSynset(state.selectedSynsetId); if (!ss) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (v('f-ssid')  !== null) ss.id          = v('f-ssid');
  if (v('f-ssili') !== null) ss.ili         = v('f-ssili');
  if (v('f-ssbc')  !== null) ss.baseConcept = v('f-ssbc');
  if (v('f-s-comment') !== null) ss.comment = v('f-s-comment');

  ss.definitions = [];
  document.querySelectorAll('.def-row').forEach(r => { const g = r.querySelector('.def-gloss').value; if (g) ss.definitions.push({ gloss: g, language: r.querySelector('.def-lang').value, provenance: r.querySelector('.def-prov').value }); });

  ss.synsetRelations = [];
  document.querySelectorAll('.ssr-row').forEach(r => { const t = r.querySelector('.ssr-target').value; if (t) ss.synsetRelations.push({ relType: r.querySelector('.ssr-type').value, target: t, provenance: r.querySelector('.ssr-prov').value }); });

  state.modified = true;
}

// =====================================================================
// RENDER
// =====================================================================

function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sel(opts, cur) { return opts.map(o => `<option value="${h(o)}"${o===cur?' selected':''}>${h(o)||'—'}</option>`).join(''); }

// Manual review status pill shown next to an entry/synset title
function buildStatusPill(status) {
  if (!status || !STATUS_STYLE[status]) return '';
  const c = STATUS_STYLE[status];
  return `<span class="pill" style="background:${c.bg};color:${c.fg}">${h(status)}</span>`;
}

// Manual review status buttons + comment field, shown at the top of an entry/synset editor
function buildStatusRow(item, itemType) {
  const prefix = itemType === 'entry' ? 'e' : 's';
  const buttons = STATUS_OPTS.map(st => {
    const active = item.status === st;
    const c = STATUS_STYLE[st];
    const style = active ? `background:${c.fg};color:#fff;border-color:${c.fg}` : `color:${c.fg};border-color:${c.fg}`;
    return `<button type="button" class="statusbtn" style="${style}" onclick="setItemStatus('${itemType}','${st}')">${h(st)}</button>`;
  }).join('');
  return `<div class="card" style="padding:10px 14px">
    <div class="irow" style="gap:8px;flex-wrap:wrap;margin-bottom:0">
      ${buttons}
      <input type="text" id="f-${prefix}-comment" class="grow" placeholder="Comment…" value="${h(item.comment)}" style="min-width:160px">
    </div>
  </div>`;
}

// Set (or, clicking the active one again, clear) the manual review status of the
// currently selected entry or synset, then re-render its editor pane and autosave.
function setItemStatus(itemType, status) {
  const item = itemType === 'entry' ? getEntry(state.selectedId) : getSynset(state.selectedSynsetId);
  if (!item) return;
  item.status = (item.status === status) ? '' : status;
  state.modified = true;
  if (itemType === 'entry') renderEntryEditor(); else renderSynsetEditor();
  // A synset's status also shows up as a column in the "Senses" overview table, which
  // lives in the entry pane and is otherwise never told to re-render on a synset edit.
  if (itemType === 'synset' && state.selectedGroupIds) renderEntryEditor();
  updateStatusBar();
  scheduleAutosave(itemType);
}

function renderAll() {
  renderFilters();
  rebuildVS(); renderVS(true); renderEditor(); updateStatusBar();
  document.getElementById('tb-name').textContent = state.globalInfo.label || state.filename || '';
}

function renderEntryEditor() {
  const empty = document.getElementById('ed-e-empty');
  const content = document.getElementById('ed-e-content');
  if (!empty || !content) return;
  if (state.selectedGroupIds) {
    empty.style.display = 'none'; content.style.display = 'block';
    content.innerHTML = buildOverviewHTML(state.selectedGroupIds);
    return;
  }
  const item = getEntry(state.selectedId);
  if (!item) { empty.style.display = 'flex'; content.style.display = 'none'; return; }
  empty.style.display = 'none'; content.style.display = 'block';
  content.innerHTML = buildEntryHTML(item);
  attachEntryListeners(item);
}

function renderSynsetEditor() {
  const empty = document.getElementById('ed-s-empty');
  const content = document.getElementById('ed-s-content');
  if (!empty || !content) return;
  const item = getSynset(state.selectedSynsetId);
  if (!item) { empty.style.display = 'flex'; content.style.display = 'none'; return; }
  empty.style.display = 'none'; content.style.display = 'block';
  content.innerHTML = buildSynsetHTML(item);
  _graphExpanded = new Set();
  _graphView = { x: 0, y: 0, scale: 1 };
  renderSynsetGraph(item.id);
}

  renderEntryEditor();

}

function attachEntryListeners(entry) {
  const fl = document.getElementById('f-lemma');
  if (fl) fl.addEventListener('input', function() {
    const e = getEntry(state.selectedId); if (e) e.lemma = this.value;
    document.getElementById('eh-title').textContent = this.value || 'New Entry';
    rebuildVSE(); renderVSE();
  });
  const fp = document.getElementById('f-pos');
  if (fp) fp.addEventListener('change', function() {
    const e = getEntry(state.selectedId); if (e) e.partOfSpeech = this.value;
    const b = document.getElementById('eh-badge'); b.textContent = this.value; b.style.display = this.value ? '' : 'none';
    rebuildVSE(); renderVSE();
  });
}

function buildCompRow(c) {

function addComp() {
  const con = document.getElementById('comp-con'); if (!con) return;

  con.insertAdjacentHTML('beforeend', buildCompRow({ complement: '', preposition: '' }));
}

function buildSensesCard(entry) {
  return `<div class="card">
    <div class="card-hd">Senses <button class="addbtn" onclick="addSense()">+ Add</button></div>
    <div id="senses-con">${entry.senses.map((s, i) => buildSenseBlock(s, i, entry.senses.length)).join('')}</div>
  </div>`;
}

function buildSenseBlock(sense, idx, total) {
  // Synset gloss for the linked synset
  const _ss = sense.synset ? getSynset(sense.synset) : null;
  const _ssGloss = _ss && _ss.definitions && _ss.definitions.length ? _ss.definitions[0].gloss : '';

  // Semantics-noun section
  const snHTML = sense.semanticsNoun !== null ? `
    <div class="row">
      <div class="field"><label>Reference</label><select class="sn-ref">${sel(SN_REF_OPTS, sense.semanticsNoun.reference)}</select></div>
      <div class="field"><label>Countability</label><select class="sn-count">${sel(SN_COUNT_OPTS, sense.semanticsNoun.countability)}</select></div>
      <div class="field"><label>Semantic Type</label><select class="sn-semtype">${sel(SN_SEMTYPE_OPTS, sense.semanticsNoun.semanticType)}</select></div>
      <div class="field"><label>Sub Type</label><input type="text" class="sn-subtype" value="${h(sense.semanticsNoun.semanticSubType)}"></div>
    </div>
    <div class="sublabel">Semantic Shifts <button class="addbtn" onclick="addSNShift(this)">+ Add</button></div>
    <div class="snshift-list">${(sense.semanticsNoun.shifts||[]).map(sh => `<div class="irow snshift-row"><select class="snshift-type grow">${sel(SN_SEMTYPE_OPTS, sh.semanticType)}</select><button class="delbtn" onclick="this.closest('.snshift-row').remove()">&#x2715;</button></div>`).join('') || '<div class="empty-msg">None.</div>'}</div>` : '';

  // Semantics-verb section
  const svHTML = sense.semanticsVerb !== null ? `
    <div class="svtype-list">${(sense.semanticsVerb.semanticTypes||[]).map(t => buildSVTypeRow(t)).join('') || '<div class="empty-msg sv-empty">No types.</div>'}</div>
    <button class="addbtn" onclick="addSVType(this)">+ Add Type</button>` : '';

  // Semantics-adj section
  const saHTML = sense.semanticsAdj !== null ? `
    <div class="field"><label>Semantic Type</label><select class="sa-semtype">${sel(SA_SEMTYPE_OPTS, sense.semanticsAdj.semanticType)}</select></div>
    <div class="sublabel">Semantic Shifts <button class="addbtn" onclick="addSAShift(this)">+ Add</button></div>
    <div class="sashift-list">${(sense.semanticsAdj.shifts||[]).map(sh => `<div class="irow sashift-row"><select class="sashift-type grow">${sel(SA_SEMTYPE_OPTS, sh.semanticType)}</select><button class="delbtn" onclick="this.closest('.sashift-row').remove()">&#x2715;</button></div>`).join('') || '<div class="empty-msg">None.</div>'}</div>` : '';

  return `<div class="sblock" id="sb-${h(sense.id)}" data-sid="${h(sense.id)}">
    <div class="sblock-hd">
      <span class="snum">Sense ${idx + 1}</span>
      <span class="sid-tag">${h(sense.id)}</span>
      ${total > 1 ? `<button class="addbtn" style="border-color:#e74c3c;color:#e74c3c" onclick="removeSense(this)">Remove</button>` : ''}
    </div>
    <div class="row">
      <div class="field w3"><label>Definition</label><textarea class="s-def" rows="2" placeholder="Enter definition…">${h(sense.definition)}</textarea></div>
      <div class="field"><label>Sense ID</label><input type="text" class="s-senseid" value="${h(sense.senseId)}"></div>
    </div>
    <div class="row">
      <div class="field w2"><label>Synset <span style="font-size:10px;color:#aaa;font-weight:400">(type ID or paste, then Save)</span></label>
        <div style="display:flex;gap:4px">
          <input type="text" class="s-synset" style="flex:1;min-width:0" value="${h(sense.synset)}" placeholder="e.g. eng-30-06952861-n" oninput="updateSenseGloss(this)">
          ${sense.synset ? `<button class="addbtn" onclick="jumpToSynset(this.previousElementSibling.value)" title="Open in Synsets panel" style="white-space:nowrap;flex-shrink:0">&#x2197; Open</button>` : ''}
          ${sense.synset ? `<button class="addbtn" style="border-color:#e74c3c;color:#e74c3c;white-space:nowrap;flex-shrink:0" onclick="unlinkSense(this)" title="Remove synset link">Unlink</button>` : `<button class="addbtn" style="white-space:nowrap;flex-shrink:0" onclick="linkSense(this)" title="Set synset from input">Link</button>`}
        </div>
        ${_ssGloss ? `<div class="sense-gloss">${h(_ssGloss)}</div>` : `<div class="sense-gloss" style="display:none"></div>`}
      </div>
      <div class="field"><label>Provenance</label><input type="text" class="s-prov" value="${h(sense.provenance)}"></div>
      <div class="field"><label>Annotator</label><input type="text" class="s-annot" value="${h(sense.annotator)}"></div>
    </div>

    <div class="sublabel">Sense Relations <button class="addbtn" onclick="addSR(this)">+ Add</button></div>
    <div class="sr-list">${sense.senseRelations.map(sr => `<div class="irow sr-row">
      <select class="sr-type" style="min-width:120px">${sel(SR_TYPE_OPTS, sr.relationType)}</select>
      <input type="text" class="sr-tgt grow" value="${h(sr.targetSenseId)}" placeholder="Target sense ID…">
      <button class="delbtn" onclick="this.closest('.sr-row').remove()">&#x2715;</button>
    </div>`).join('') || '<div class="empty-msg sr-empty">None.</div>'}</div>

    <details>
      <summary>Semantics-noun
        ${sense.semanticsNoun === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSN(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSN(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sn-section">${snHTML}</div>
    </details>

    <details>
      <summary>Semantics-verb
        ${sense.semanticsVerb === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSV(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSV(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sv-section" ${sense.semanticsVerb !== null ? 'data-present="1"' : ''}>${svHTML}</div>
    </details>

    <details>
      <summary>Semantics-adjective
        ${sense.semanticsAdj === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSA(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSA(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sa-section">${saHTML}</div>
    </details>

    <details>
      <summary>Pragmatics</summary>
      <div class="row" style="padding-top:8px">
        <div class="field"><label>Chronology</label><select class="prag-chron">${sel(CHRONOLOGY_OPTS, sense.pragmatics.chronology)}</select></div>
        <div class="field"><label>Connotation</label><select class="prag-conn">${sel(CONNOTATION_OPTS, sense.pragmatics.connotation)}</select></div>
        <div class="field"><label>Geography</label><select class="prag-geo">${sel(GEOGRAPHY_OPTS, sense.pragmatics.geography)}</select></div>
        <div class="field"><label>Register</label><select class="prag-reg">${sel(REGISTER_OPTS, sense.pragmatics.register)}</select></div>
      </div>
      <div class="sublabel">Domains <button class="addbtn" onclick="addDomain(this)">+ Add</button></div>
      <div class="dom-list">${sense.pragmatics.domains.map(d => buildDomainRow(d)).join('') || '<div class="empty-msg dom-empty">None.</div>'}</div>
    </details>

    <details>
      <summary>Sense Examples <button class="addbtn" onclick="event.preventDefault();addExample(this)" style="margin-left:8px">+ Add</button></summary>
      <div class="ex-list">${sense.examples.map(ex => buildExRow(ex)).join('') || '<div class="empty-msg ex-empty">None.</div>'}</div>
    </details>

    <details>
      <summary>Sentiment
        ${sense.sentiment === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSentiment(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSentiment(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sent-section">${sense.sentiment ? buildSentimentFields(sense.sentiment) : ''}</div>
    </details>
  </div>`;
}

function buildSVTypeRow(t) {
  return `<div class="irow svtype-row">
    <select class="sv-semtype" style="min-width:100px">${sel(SV_SEMTYPE_OPTS, t.semanticType)}</select>
    <input type="text" class="sv-featset grow" value="${h(t.semanticFeatureSet)}" placeholder="semanticFeatureSet…">

function buildDomainRow(d) {

      </div>

        <div class="field"><label>Pragmatics &ndash; Geography</label><select class="ex-pr-geo">${sel(GEOGRAPHY_OPTS, pr.geography)}</select></div>

// ── Sense mutations ───────────────────────────────────────────────────

function addSense() { collectEditorState(); const e = getEntry(state.selectedId); if (!e) return; e.senses.push(makeSense()); renderEditor(); }
function removeSense(btn) { if (!confirm('Remove?')) return; btn.closest('.sblock').remove(); }

function toggleSN(btn, add) {
  const sec = btn.closest('details').querySelector('.sn-section');
  if (add) {
    sec.innerHTML = buildSenseBlock({ semanticsNoun: { reference:'',countability:'',semanticType:'',semanticSubType:'',shifts:[] }, pragmatics:{}, senseRelations:[], examples:[] }, 0, 1).match(/class="sn-section">([\s\S]*?)<\/div>\s*<\/details>/)?.[1] || '';

// ── Overview panel (grouped entry view) ──────────────────────────────

function buildOverviewHTML(entryIds) {
  const items = entryIds.map(id => getEntry(id)).filter(Boolean);
  if (!items.length) return '';
  const rawLemma = items[0].isMWE ? items[0].mweForm : items[0].lemma;
  const label = h(rawLemma) || '—';

  // Every synset used by any sense of this lemma — used to detect auto-hyponymy
  // (a sense whose synset has a hyperonym relation to another sense's synset of the same word,
  // i.e. this sense is a hyponym of a sibling sense).
  const groupSynsetIds = new Set();
  for (const e of items) for (const sn of (e.senses || [])) if (sn.synset) groupSynsetIds.add(sn.synset);
  const HYPERONYM_RELTYPES = new Set(['has_hyperonym', 'has_xpos_hyperonym']);

  // Build one row-data object per entry (raw sort values alongside rendered HTML cells),
  // then sort the collection generically by whichever column the user last clicked.
  const rowData = items.map(e => {
    const senses = e.senses && e.senses.length ? e.senses : [];
    const s = senses[0] || null;

    // All sense definitions joined with ";"
    const defText = senses.map(x => x.definition).filter(Boolean).join('; ') || '—';

    // Synset from first sense; prefer English-tagged glosses, else fall back
    // to any available gloss (e.g. an unfetched stub synset's raw gloss).
    const ss = (s && s.synset) ? getSynset(s.synset) : null;
    const allGlosses = (ss && ss.definitions ? ss.definitions : []).map(d => d.gloss).filter(Boolean);
    const enGlosses = (ss && ss.definitions ? ss.definitions : [])
      .filter(d => (d.language || '').toLowerCase().startsWith('en')).map(d => d.gloss).filter(Boolean);
    const glossText = (enGlosses.length ? enGlosses : allGlosses).join('; ');

    const synCell = (s && s.synset)
      ? `<span class="ov-synlink" onclick="event.stopPropagation();jumpToSynset('${h(s.synset)}')">${h(s.synset)}</span>`
      : '—';

    const statusCell = ss ? (buildStatusPill(ss.status) || '—') : '—';

    // Auto-hyponymy: this sense's synset has a hyperonym relation to a sibling sense's synset
    // in this same lemma group — link to that hypernym rather than just flagging "true".
    const hypernymTargets = ss && ss.synsetRelations
      ? [...new Set(ss.synsetRelations
          .filter(r => HYPERONYM_RELTYPES.has(r.relType) && r.target !== s.synset && groupSynsetIds.has(r.target))
          .map(r => r.target))]
      : [];
    const autoHypCell = hypernymTargets.length
      ? hypernymTargets.map(t => `<span class="ov-synlink" onclick="event.stopPropagation();jumpToSynset('${h(t)}')">${h(t)}</span>`).join(', ')
      : '—';

    // Manual review status of the sense itself (i.e. of the entry, which holds one sense
    // in this table) — distinct from the synset's own status shown in the Synset Status column.
    const senseStatusCell = buildStatusPill(e.status) || '—';

    return {
      entryId: e.id,
      form: e.isMWE ? e.mweForm : e.lemma,
      pos: e.partOfSpeech || '',
      senseNr: s ? (s.senseId || '') : '',
      senseId: s ? (s.id || '') : '',
      senseStatusCell, senseStatus: e.status || '',
      defText, synCell,
      synset: (s && s.synset) || '',
      statusCell, status: ss ? (ss.status || '') : '',
      autoHypCell, autoHyp: hypernymTargets.join(', '),
      glossText
    };
  });

  // Numeric-aware compare (falls back to lexicographic) so senseNr sorts 2 before 10.
  const cmp = (va, vb) => {
    const na = parseFloat(va), nb = parseFloat(vb);
    if (va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb)) return na - nb;
    return String(va).localeCompare(String(vb));
  };
  const { key, dir } = state.ovSort;
  rowData.sort((a, b) => cmp(a[key], b[key]) * dir);

  const rows = rowData.map(r => `<tr class="ov-row" onclick="selectEntry('${h(r.entryId)}')">
      <td>${h(r.form)}</td>
      <td>${h(r.pos || '—')}</td>
      <td class="ov-id">${h(r.senseNr || '—')}</td>
      <td class="ov-id">${h(r.senseId || '—')}</td>
      <td class="ov-id">${r.senseStatusCell}</td>
      <td class="ov-def">${h(r.defText)}</td>
      <td class="ov-id">${r.synCell}</td>
      <td class="ov-id">${r.statusCell}</td>
      <td class="ov-id">${r.autoHypCell}</td>
      <td class="ov-def">${h(r.glossText) || '—'}</td>
    </tr>`).join('');

  const OV_COLS = [
    ['form', 'Form'], ['pos', 'POS'], ['senseNr', 'Sense Nr'], ['senseId', 'Sense ID'],
    ['senseStatus', 'Sense Status'], ['defText', 'Definition'], ['synset', 'Synset'],
    ['status', 'Synset Status'], ['autoHyp', 'Auto-hyponymy'], ['glossText', 'Synset gloss']
  ];
  const headHtml = OV_COLS.map(([k, label]) => {
    const arrow = key === k ? (dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th class="ov-sortable" onclick="sortOverview('${k}')">${h(label)}${arrow}</th>`;
  }).join('');

  return `
  <div class="ed-hd">
    <h2>${label}</h2>
    <span class="pill pill-blue">${items.length} entr${items.length === 1 ? 'y' : 'ies'}</span>
    <span style="font-size:12px;color:#aaa;margin-left:6px">— click a row to edit, a column header to sort</span>
  </div>
  <div class="card">
    <div class="card-hd">Senses <button class="addbtn" onclick="openNewEntryDialog(${JSON.stringify(rawLemma)})">+ Add sense</button></div>
    <div style="overflow-x:auto">
      <table class="ov-table">
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// Toggle the Senses-overview sort: clicking the active column reverses direction,
// clicking a different one sorts ascending on it.
function sortOverview(key) {
  const s = state.ovSort;
  s.dir = (s.key === key) ? -s.dir : 1;
  s.key = key;
  renderEntryEditor();
}

function selectEntry(id) {
  state.selectedGroupIds = null;
  state.selectedId = id;
  // In collab mode the entry may be a stub — use window.selectItem to lazy-load
  if (typeof collabMode !== 'undefined' && collabMode) {
    const e = getEntry(id);
    if (e && e._indexOnly) {
      fetch('/api/entry/' + encodeURIComponent(id))
        .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
        .then(full => { const idx = state.entries.findIndex(x => x.id === id); if (idx >= 0) state.entries[idx] = full; renderVSE(); renderEntryEditor(); document.getElementById('ed-e').scrollTop = 0; })
        .catch(err => { showToast('Could not fetch: ' + err, true); renderVSE(); renderEntryEditor(); document.getElementById('ed-e').scrollTop = 0; });
      return;
    }
  }
  renderVSE(); renderEntryEditor();
  document.getElementById('ed-e').scrollTop = 0;
}

// Build a synsetId → [{id, lemma, partOfSpeech, isMWE, examples}] map from loaded entries
function getSynonymEntries(synsetId) {
  const results = [];
  for (const e of state.entries) {
    if (e._indexOnly) continue; // not yet fetched in collab mode
    for (const s of (e.senses || [])) {
      if (s.synset === synsetId) {
        results.push({ id: e.id, lemma: e.isMWE ? e.mweForm : e.lemma, partOfSpeech: e.partOfSpeech, isMWE: e.isMWE,
                       examples: (s.examples || []).map(x => x.textualForm).filter(Boolean) });
        break;
      }
    }
  }
  return results;
}

function buildEnSynonymsCard(ss) {
  const words = ss._en_synonyms;
  if (!words || words.length === 0) return '';
  const pills = words.map(w =>
    `<span class="en-syn-pill">${h(w.replace(/_/g, ' '))}</span>`
  ).join('');
  const examples = ss._en_examples;
  const examplesHtml = (examples && examples.length)
    ? `<div style="margin-top:8px;font-size:12px;color:#777;font-style:italic">${examples.map(x => '"' + h(x) + '"').join('; ')}</div>`
    : '';
  return `<div class="card">
    <div class="card-hd">English synonyms <span style="font-weight:400;font-size:11px;color:#aaa">(read-only · Princeton WordNet 3.0)</span></div>
    <div class="en-syns-list">${pills}</div>
    ${examplesHtml}
  </div>`;
}

function buildSynonymsCard(ss) {
  const ssId = typeof ss === 'string' ? ss : ss.id;
  // In collab mode the server provides _nl_entries with all Dutch synonyms;
  // in standalone mode fall back to scanning loaded entries in memory.
  let syns;
  if (ss._nl_entries) {
    syns = ss._nl_entries;
  } else {
    syns = getSynonymEntries(ssId).map(e => ({
      id: e.id, lemma: e.isMWE ? (e.mweForm || e.id) : (e.lemma || e.id), partOfSpeech: e.partOfSpeech || '',
      examples: e.examples || []
    }));
  }
  const note = (!ss._nl_entries && collabMode && syns.length === 0)
    ? '<div class="empty-msg">Open individual entries to index their synset links.</div>'
    : (syns.length === 0 ? '<div class="empty-msg">No entries reference this synset.</div>' : '');
  return `<div class="card">
    <div class="card-hd">Dutch synonyms <span>${syns.length ? syns.length + ' entr' + (syns.length === 1 ? 'y' : 'ies') : ''}</span></div>
    ${note}
    ${syns.map(e => `<div class="irow" style="padding:4px 0;border-bottom:1px solid #f4f4f4;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <span style="font-weight:600;font-size:13px">${h(e.lemma)}</span>
        <span style="font-size:11px;color:#999;margin-left:6px;text-transform:uppercase">${h(e.partOfSpeech)}</span>
        ${(e.examples && e.examples.length) ? `<div style="font-size:12px;color:#777;font-style:italic;margin-top:2px">${e.examples.map(x => '"' + h(x) + '"').join('; ')}</div>` : ''}
      </div>
      <button class="addbtn" onclick="jumpToEntry('${h(e.id)}')" title="Open in Entries panel">&#x2197; Open</button>
      <button class="addbtn" style="border-color:#e74c3c;color:#e74c3c" onclick="unlinkSynonym('${h(e.id)}','${h(ssId)}')" title="Remove synset link">Unlink</button>
    </div>`).join('')}
    <div class="syn-add-row">
      <input type="text" id="syn-add-input" placeholder="Entry ID…" style="flex:1;font-size:12px;padding:4px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333">
      <button class="addbtn" onclick="addSynonym('${h(ssId)}')">+ Link ID</button>
      <button class="addbtn" onclick="openSynSearch('${h(ssId)}')">&#128269; Find word</button>
    </div>
  </div>`;
}

function jumpToSynset(synsetId) {
  if (!synsetId) return;
  collectSynsetState();
  state.selectedGroupIds = null;
  rebuildVSS();
  const ss = getSynset(synsetId);
  if (!ss) { showToast('Synset not found: ' + synsetId, true); renderVSS(true); return; }
  scrollVSToIdS(synsetId);
  updateStatusBar();
  if (collabMode) {
    const prev = state.selectedSynsetId;
    state.selectedSynsetId = null;
    window.selectItem(synsetId, 'synsets');
  } else {
    state.selectedSynsetId = synsetId;
    renderVSS();
    renderSynsetEditor();
    document.getElementById('ed-s').scrollTop = 0;
  }
}

function jumpToEntry(entryId) {
  if (!entryId) return;
  collectEditorState();
  rebuildVSE();
  const e = getEntry(entryId);
  if (!e) { showToast('Entry not found: ' + entryId, true); renderVSE(true); return; }
  scrollVSToIdE(entryId);
  updateStatusBar();
  if (collabMode) {
    state.selectedId = null;
    window.selectItem(entryId, 'entries');
  } else {
    state.selectedId = entryId;
    state.selectedGroupIds = null;
    renderVSE();
    renderEntryEditor();
    document.getElementById('ed-e').scrollTop = 0;
  }
}

function scrollVSToIdE(id) {
  const listEl = document.getElementById('entry-list-e');
  if (!listEl) return;
  const vsIdx = vsFilteredE.findIndex(i => state.entries[i] && state.entries[i].id === id);
  if (vsIdx < 0) return;
  const targetY = vsIdx * ITEM_H;
  const viewH = listEl.clientHeight || 600;
  if (targetY < listEl.scrollTop || targetY + ITEM_H > listEl.scrollTop + viewH) {
    listEl.scrollTop = Math.max(0, targetY - viewH / 2 + ITEM_H / 2);
  }
  _paintVSE(listEl);
}

function scrollVSToIdS(id) {
  const listEl = document.getElementById('entry-list-s');
  if (!listEl) return;
  const vsIdx = vsFilteredS.findIndex(i => state.synsets[i] && state.synsets[i].id === id);
  if (vsIdx < 0) return;
  const targetY = vsIdx * ITEM_H;
  const viewH = listEl.clientHeight || 600;
  if (targetY < listEl.scrollTop || targetY + ITEM_H > listEl.scrollTop + viewH) {
    listEl.scrollTop = Math.max(0, targetY - viewH / 2 + ITEM_H / 2);
  }
  _paintVSS(listEl);
}

function scrollVSToId(id) {
  if (state.mode === 'entries') scrollVSToIdE(id);
  else scrollVSToIdS(id);
}

// =====================================================================
// COLLABORATIVE MODE
// =====================================================================

let collabMode = false;
let collabSeq  = 0;
let collabUser = '';
let collabCache = { entries: {}, synsets: {} };
let collabSaveTimer = null;
let _lastSavePane = 'entry';     // which pane last had user input
let collabLockE = null;          // lock on currently-edited entry
let collabLockS = null;          // lock on currently-edited synset
let _lockCountdownTimerE = null;
let _lockCountdownTimerS = null;

// Auth state
let lmf_token    = localStorage.getItem('lmf_token')    || '';
let lmf_username = localStorage.getItem('lmf_username') || '';

function _authFetch(url, opts = {}) {
  if (lmf_token) {
    opts.headers = Object.assign({ 'X-Session-Token': lmf_token }, opts.headers || {});
  }
  return fetch(url, opts);
}

function getOrSetUser() {
  collabUser = lmf_username || 'anon';
  return collabUser;
}

async function initCollab() {
  try {
    const resp = await fetch('/api/status', { signal: AbortSignal.timeout(1500) });
    if (!resp.ok) return;
    collabMode = true;

    // Validate stored session
    if (lmf_token) {
      try {
        const w = await _authFetch('/api/whoami');
        if (w.ok) {
          const wj = await w.json();
          lmf_username = wj.username;
          localStorage.setItem('lmf_username', lmf_username);
          getOrSetUser();
          await _afterLogin();
          return;
        }
      } catch (_) {}
      // Token invalid — clear it
      lmf_token = '';
      localStorage.removeItem('lmf_token');
    }

    // No valid session — show login form
    _showLoginOverlay();
  } catch (_) {
    // No server running — standalone mode
  }
}

function _showLoginOverlay() {
  const ov = document.getElementById('login-overlay');
  if (ov) { ov.classList.add('active'); document.getElementById('login-user').focus(); }
  // Allow Enter key in password field
  const pw = document.getElementById('login-pass');
  if (pw) pw.onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  const u = document.getElementById('login-user');
  if (u)  u.onkeydown = e => { if (e.key === 'Enter') document.getElementById('login-pass').focus(); };
}

async function doLogin() {
  const usernameEl = document.getElementById('login-user');
  const passwordEl = document.getElementById('login-pass');
  const errEl      = document.getElementById('login-err');
  const btn        = document.getElementById('login-btn');
  const username   = usernameEl.value.trim();
  const password   = passwordEl.value;
  if (!username || !password) {
    errEl.textContent = 'Please enter your username and password.';
    errEl.style.display = 'block'; return;
  }
  btn.disabled = true; btn.textContent = 'Signing in…';
  errEl.style.display = 'none';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const res = await resp.json();
    if (!resp.ok) {
      errEl.textContent = res.error || 'Login failed.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
      passwordEl.value = ''; passwordEl.focus();
      return;
    }
    lmf_token    = res.token;
    lmf_username = res.username;
    localStorage.setItem('lmf_token',    lmf_token);
    localStorage.setItem('lmf_username', lmf_username);
    getOrSetUser();
    document.getElementById('login-overlay').classList.remove('active');
    btn.disabled = false; btn.textContent = 'Sign in';
    await _afterLogin();
  } catch (err) {
    errEl.textContent = 'Connection error: ' + err.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function doLogout() {
  try {
    await _authFetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  } catch (_) {}
  localStorage.removeItem('lmf_token');
  localStorage.removeItem('lmf_username');
  window.location.reload();
}

async function _afterLogin() {
  const status = await (await fetch('/api/status')).json().catch(() => ({}));
  _updateCollabDot(true, status.active_users || 1);
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.style.display = 'inline-block';
  const tbUser = document.getElementById('tb-username');
  if (tbUser) tbUser.textContent = lmf_username;
  await fetchIndex();
  setInterval(pollChanges, 3000);
  setInterval(sendHeartbeat, 30000);
  sendHeartbeat();
  document.getElementById('ed-e').addEventListener('focusin', () => _lastSavePane = 'entry');
  document.getElementById('ed-s').addEventListener('focusin', () => _lastSavePane = 'synset');
  document.getElementById('ed-e').addEventListener('input',  () => scheduleAutosave('entry'));
  document.getElementById('ed-e').addEventListener('change', () => scheduleAutosave('entry'));
  document.getElementById('ed-s').addEventListener('input',  () => scheduleAutosave('synset'));
  document.getElementById('ed-s').addEventListener('change', () => scheduleAutosave('synset'));
}

async function fetchIndex() {
  showLoading('Loading index from server…');
  try {
    const resp = await _authFetch('/api/index');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    collabSeq        = data.seq || 0;
    state.globalInfo = data.globalInfo || state.globalInfo;
    state.lexicon    = data.lexicon    || state.lexicon;
    state.filename   = data.filename   || state.filename;
    // Build lightweight index stubs for virtual scrolling
    state.entries = (data.entry_index || []).map(ei => ({
      id: ei.id, lemma: ei.lemma || '', partOfSpeech: ei.partOfSpeech || '',
      isMWE: !!ei.isMWE, mweForm: ei.mweForm || '', hasMissingSynset: !!ei.hasMissingSynset,
      hasAutohyponymy: !!ei.hasAutohyponymy, stubSenseId: ei.senseId || '', _indexOnly: true,
      // stub fields needed by serializer/collectEditorState (never serialized in collab mode)
      wordForms: [], relatedForms: [], senses: [],
      morphology: { morphoType:'', comparisonType:'', declinable:'', separability:'' },
      morphoSyntax: { pronominalAndGrammaticalGender:'', adverbialUsage:'', position:'', reflexivity:'', auxiliaries:[] },
      syntacticBehaviour: { valency:'', transitivity:'', complementations:[], subcatFrames:[] }
    }));
    state.synsets = (data.synset_index || []).map(si => ({
      id: si.id, ili: '', baseConcept: '', _indexOnly: true,
      hasDutchSynonyms: !!si.hasDutchSynonyms,
      definitions: si.gloss ? [{ gloss: si.gloss, language: '', provenance: '' }] : [],
      enSyns: si.enSyns || '', nlSyns: si.nlSyns || '', nlExamples: si.nlExamples || '',
      synsetRelations: [], monolingualExternalRefs: []
    }));
    state.modified = false;
    state.selectedId = null;
    state.selectedSynsetId = null;
    hideLoading();
    renderAll();
    showToast('Connected — ' + state.entries.length + ' entries, ' + state.synsets.length + ' synsets');
  } catch (err) {
    hideLoading();
    showToast('Could not load index: ' + err.message, true);
  }
}

// Override selectItem to fetch full data lazily from server
const _selectItemOrig = selectItem;
window.selectItem = async function(id, type) {
  if (!collabMode) { _selectItemOrig(id, type); return; }

  if (type === 'synsets') {
    // ── Synset pane ──────────────────────────────────────────────────
    if (state.selectedSynsetId === id) return;

    // Release previous synset lock
    if (state.selectedSynsetId && collabLockS && collabLockS.is_mine) {
      _releaseLock(collabLockS.item_type, state.selectedSynsetId);
    }
    collabLockS = null;
    _updateLockBannerForPane('synset');

    // Flush current synset before switching
    if (state.selectedSynsetId) {
      collectSynsetState();
      await _pushUpdate('update', 'synset', getSynset(state.selectedSynsetId));
    }

    state.selectedSynsetId = id;
    state.mode = 'synsets';
    renderVSS();

    try {
      const resp = await _authFetch('/api/synset/' + encodeURIComponent(id));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const full = await resp.json();
      if (full._lock) { collabLockS = { ...full._lock, item_type: 'synset', item_id: id }; delete full._lock; }
      const idx = state.synsets.findIndex(s => s.id === id);
      if (idx >= 0) state.synsets[idx] = full;
    } catch (err) {
      showToast('Could not fetch synset: ' + err.message, true);
    }
    _updateLockBannerForPane('synset');
    renderSynsetEditor();
    document.getElementById('ed-s').scrollTop = 0;

  } else {
    // ── Entry pane ───────────────────────────────────────────────────
    state.mode = 'entries';
    const grp = vsGroupsE[id];
    if (grp && state.selectedGroupIds && state.selectedGroupIds[0] === id) return;
    if (!grp && state.selectedId === id && !state.selectedGroupIds) return;

    // Release previous entry lock
    if (!state.selectedGroupIds && state.selectedId && collabLockE && collabLockE.is_mine) {
      _releaseLock(collabLockE.item_type, state.selectedId);
    }
    collabLockE = null;
    _updateLockBannerForPane('entry');

    // Flush current entry before switching
    if (!state.selectedGroupIds && state.selectedId) {
      collectEditorState();
      await _pushUpdate('update', 'entry', getEntry(state.selectedId));
    }

    state.selectedId = id;
    renderVSE();

    if (grp && grp.length > 1) {
      const groupIds = grp.map(i => state.entries[i].id);
      state.selectedGroupIds = groupIds;
      // Always re-fetch every member fresh from the server (not just still-unhydrated
      // stubs) so the overview reflects the latest status/relations even when the edit
      // — this user's own, or a collaborator's — happened after this entry/synset was
      // first loaded into this tab.
      await Promise.all(groupIds.map(async gid => {
        try {
          const r = await _authFetch('/api/entry/' + encodeURIComponent(gid));
          if (r.ok) { const full = await r.json(); delete full._lock; const idx = state.entries.findIndex(x => x.id === gid); if (idx >= 0) state.entries[idx] = full; }
        } catch (_) {}
      }));
      // Also refresh linked synsets, so the overview's status, auto-hyponymy and
      // synset gloss columns are current (stub synsets carry no language-tagged
      // definitions, only a raw truncated gloss).
      const synsetIds = new Set();
      for (const gid of groupIds) {
        for (const s of (getEntry(gid)?.senses || [])) if (s.synset) synsetIds.add(s.synset);
      }
      await Promise.all([...synsetIds].map(async sid => {
        try {
          const r = await _authFetch('/api/synset/' + encodeURIComponent(sid));
          if (r.ok) { const full = await r.json(); delete full._lock; const idx = state.synsets.findIndex(x => x.id === sid); if (idx >= 0) state.synsets[idx] = full; }
        } catch (_) {}
      }));
      renderEntryEditor();
      document.getElementById('ed-e').scrollTop = 0;
      return;
    }

    state.selectedGroupIds = null;
    try {
      const resp = await _authFetch('/api/entry/' + encodeURIComponent(id));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const full = await resp.json();
      if (full._lock) { collabLockE = { ...full._lock, item_type: 'entry', item_id: id }; delete full._lock; }
      const idx = state.entries.findIndex(e => e.id === id);
      if (idx >= 0) state.entries[idx] = full;
    } catch (err) {
      showToast('Could not fetch entry: ' + err.message, true);
    }
    _updateLockBannerForPane('entry');
    renderEntryEditor();
    document.getElementById('ed-e').scrollTop = 0;
  }
};

// Override addSynset to POST new synset to server in collab mode
const _addSynsetOrig = addSynset;
window.addSynset = async function() {
  _addSynsetOrig();
  if (!collabMode) return;
  const id = state.selectedSynsetId;
  const data = getSynset(id);
  if (data) await _pushUpdate('add', 'synset', data);
};

// Keep addItem override for any residual callers
const _addItemOrig = addItem;
window.addItem = async function() {
  if (state.mode === 'entries') { openNewEntryDialog(); return; }
  window.addSynset();
};

// Override deleteItem to also POST delete to server
window.deleteItem = async function(id) {
  if (!confirm('Delete?')) return;
  // Determine type by checking which pane this item belongs to
  const isEntry = !!getEntry(id);
  const itemType = isEntry ? 'entry' : 'synset';
  if (isEntry) {
    state.entries = state.entries.filter(e => e.id !== id);
    if (state.selectedId === id) state.selectedId = state.entries.length ? state.entries[0].id : null;
    state.selectedGroupIds = null;
    rebuildVSE(); renderVSE(); renderEntryEditor();
  } else {
    state.synsets = state.synsets.filter(s => s.id !== id);
    if (state.selectedSynsetId === id) state.selectedSynsetId = state.synsets.length ? state.synsets[0].id : null;
    rebuildVSS(); renderVSS(); renderSynsetEditor();
  }
  state.modified = true;
  updateStatusBar();
  if (collabMode) await _pushUpdate('delete', itemType, { id });
};

// Override duplicateEntry to POST copy to server
const _duplicateEntryOrig = duplicateEntry;
window.duplicateEntry = async function(id) {
  _duplicateEntryOrig(id);
  if (!collabMode) return;
  const copy = getEntry(state.selectedId);
  if (copy) await _pushUpdate('add', 'entry', copy);
};


// Debounced autosave triggered by editor input events
function scheduleAutosave(pane) {
  pane = pane || _lastSavePane;
  const btnId = pane === 'synset' ? 'save-btn-s' : 'save-btn-e';
  const btn = document.getElementById(btnId);
  if (btn) btn.disabled = false;
  if (!collabMode) return;
  const selectedId = pane === 'synset' ? state.selectedSynsetId : state.selectedId;
  if (!selectedId) return;
  clearTimeout(collabSaveTimer);
  setAutosaveStatus('Saving…');
  collabSaveTimer = setTimeout(async () => {
    collectEditorState();
    await _pushUpdate('update', pane === 'synset' ? 'synset' : 'entry');
  }, 1500);
}

async function _pushUpdate(op, itemType, data, explicit) {
  op       = op       || 'update';
  itemType = itemType || 'entry';
  if (!data) data = itemType === 'synset' ? getSynset(state.selectedSynsetId) : getEntry(state.selectedId);
  if (!data || data._indexOnly) return;
  try {
    const resp = await _authFetch('/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op, itemType, data, user: collabUser, explicit: !!explicit })
    });
    if (resp.status === 423) {
      const res = await resp.json();
      const holder = res.lock ? res.lock.user : 'someone else';
      setAutosaveStatus('Locked by ' + holder, true);
      showToast('Save blocked — ' + holder + ' is editing this item', true);
      if (res.lock) {
        const lockObj = { ...res.lock, item_type: itemType, item_id: data.id, is_mine: false };
        if (itemType === 'synset') collabLockS = lockObj; else collabLockE = lockObj;
        _updateLockBannerForPane(itemType === 'synset' ? 'synset' : 'entry');
      }
      return;
    }
    if (resp.ok) {
      const res = await resp.json();
      if (res.seq) collabSeq = res.seq;
      // Sync server-assigned _changes back onto the local item so the history popup stays current
      if (res.changes && op === 'update' && data) data._changes = res.changes;
      setAutosaveStatus('Saved');
    } else {
      setAutosaveStatus('Save error', true);
    }
  } catch (_) {
    setAutosaveStatus('Offline?', true);
  }
}

function _releaseLock(itemType, itemId) {
  if (!itemType || !itemId) return;
  // Use sendBeacon for reliability on page unload (token in body since sendBeacon has no custom headers)
  const body = JSON.stringify({ itemType, itemId, user: collabUser, token: lmf_token });
  if (navigator.sendBeacon) {
    navigator.sendBeacon('/api/unlock', new Blob([body], { type: 'application/json' }));
  } else {
    fetch('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Token': lmf_token }, body }).catch(() => {});
  }
}

function _updateLockBannerForPane(pane) {
  const isSynset = pane === 'synset';
  const bannerId = isSynset ? 'lock-banner-s' : 'lock-banner-e';
  const contentId = isSynset ? 'ed-s-content' : 'ed-e-content';
  const lock = isSynset ? collabLockS : collabLockE;
  const timerVar = isSynset ? '_lockCountdownTimerS' : '_lockCountdownTimerE';

  if (isSynset) { clearInterval(_lockCountdownTimerS); _lockCountdownTimerS = null; }
  else          { clearInterval(_lockCountdownTimerE); _lockCountdownTimerE = null; }

  const banner = document.getElementById(bannerId);
  const editor = document.getElementById(contentId);
  if (!banner) return;

  if (!lock || lock.is_mine) {
    banner.style.display = 'none';
    if (editor) editor.querySelectorAll('input,select,textarea,button.addbtn,.btn-red').forEach(el => el.disabled = false);
    return;
  }

  banner.style.display = 'flex';
  const lockUserEl = banner.querySelector('.lock-user');
  const lockTtlEl  = banner.querySelector('.lock-ttl');
  if (lockUserEl) lockUserEl.textContent = lock.user;

  function updateTtl() {
    const secs = Math.max(0, Math.round(lock.expires_at - Date.now() / 1000));
    if (lockTtlEl) lockTtlEl.textContent = secs > 0 ? `lock expires in ${secs}s` : 'lock expired — click Claim';
    if (editor) editor.querySelectorAll('input,select,textarea').forEach(el => el.disabled = true);
  }
  updateTtl();
  const timer = setInterval(() => {
    updateTtl();
    if (lock && Date.now() / 1000 > lock.expires_at) clearInterval(timer);
  }, 1000);
  if (isSynset) _lockCountdownTimerS = timer; else _lockCountdownTimerE = timer;
}

function _updateLockBanner() {
  _updateLockBannerForPane('entry');
  _updateLockBannerForPane('synset');
}

function claimLock(pane) {
  if (pane === 'synset') {
    if (!state.selectedSynsetId) return;
    const id = state.selectedSynsetId;
    state.selectedSynsetId = null;
    window.selectItem(id, 'synsets');
  } else {
    if (!state.selectedId) return;
    const id = state.selectedId;
    state.selectedId = null;
    window.selectItem(id, 'entries');
  }
}

// Poll for remote changes every 3 seconds
async function pollChanges() {
  try {
    const resp = await _authFetch('/api/changes?since=' + collabSeq);
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.changes && data.changes.length) {
      for (const ch of data.changes) applyChange(ch);
      collabSeq = data.changes[data.changes.length - 1].seq;
    }
    if (data.active_users !== undefined) _updateCollabDot(true, data.active_users);
  } catch (_) { /* network hiccup */ }
}

function applyChange(ch) {
  if (ch.user === collabUser) return; // own change already reflected locally
  const { op, itemType, data } = ch;

  if (itemType === 'entry') {
    if (op === 'delete') {
      state.entries = state.entries.filter(e => e.id !== data.id);
      if (state.selectedId === data.id) { state.selectedId = null; renderEntryEditor(); }
    } else {
      const idx = state.entries.findIndex(e => e.id === data.id);
      if (idx >= 0) {
        state.entries[idx] = data;
        if (state.selectedId === data.id) renderEntryEditor();
      } else {
        state.entries.unshift(data);
      }
    }
  } else if (itemType === 'synset') {
    if (op === 'delete') {
      state.synsets = state.synsets.filter(s => s.id !== data.id);
      if (state.selectedSynsetId === data.id) { state.selectedSynsetId = null; renderSynsetEditor(); }
    } else {
      const idx = state.synsets.findIndex(s => s.id === data.id);
      if (idx >= 0) {
        state.synsets[idx] = data;
        if (state.selectedSynsetId === data.id) renderSynsetEditor();
      } else {
        state.synsets.unshift(data);
      }
    }
  } else if (itemType === 'lexicon') {
    if (data.globalInfo) state.globalInfo = data.globalInfo;
    if (data.lexicon)    state.lexicon    = data.lexicon;
    updateStatusBar();
  }

  rebuildVS(); renderVSE(); renderVSS();
  if (collabMode) _updateLockBanner();
  showToast(ch.user + ' ' + op + 'd a ' + itemType);
}

async function sendHeartbeat() {
  try {
    await _authFetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: collabUser })
    });
  } catch (_) {}
}

// Release locks when the page is closed or navigated away
window.addEventListener('beforeunload', () => {
  if (collabMode) {
    if (collabLockE && collabLockE.is_mine && state.selectedId)
      _releaseLock(collabLockE.item_type, state.selectedId);
    if (collabLockS && collabLockS.is_mine && state.selectedSynsetId)
      _releaseLock(collabLockS.item_type, state.selectedSynsetId);
  }
});

function _updateCollabDot(connected, userCount) {
  const ind = document.getElementById('collab-ind');
  const dot = document.getElementById('collab-dot');
  const usr = document.getElementById('collab-users');
  if (!ind) return;
  ind.style.display = 'flex';
  dot.style.background = connected ? '#2ecc71' : '#e74c3c';
  usr.textContent = userCount + ' user' + (userCount === 1 ? '' : 's');
}

function setAutosaveStatus(msg, isError) {
  const el = document.getElementById('sb-autosave');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#e74c3c' : 'rgba(255,255,255,0.5)';
}

// Immediately save the current item to the database
async function editorSave(pane) {
  if (!collabMode) return;
  pane = pane || _lastSavePane;
  collectEditorState();
  const btnId = pane === 'synset' ? 'save-btn-s' : 'save-btn-e';
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  await _pushUpdate('update', pane === 'synset' ? 'synset' : 'entry', null, true);
  if (btn) { btn.textContent = 'Save'; }
}

// Update the inline gloss below a synset input when the value changes
function updateSenseGloss(input) {
  const gloss = input.closest('.field').querySelector('.sense-gloss');
  if (!gloss) return;
  const ss = input.value ? getSynset(input.value) : null;
  const text = ss && ss.definitions && ss.definitions.length ? ss.definitions[0].gloss : '';
  gloss.textContent = text;
  gloss.style.display = text ? '' : 'none';
}

// Fetch a full entry (handles stub _indexOnly entries in collab mode, or looks up in state)
async function _fetchFullEntry(entryId) {
  let entry = getEntry(entryId);
  if (entry && !entry._indexOnly) return entry;
  if (!collabMode) {
    if (!entry) throw new Error('Entry not found: ' + entryId);
    return entry;
  }
  const r = await _authFetch('/api/entry/' + encodeURIComponent(entryId));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  entry = await r.json();
  delete entry._lock;
  const idx = state.entries.findIndex(e => e.id === entryId);
  if (idx >= 0) state.entries[idx] = entry; else state.entries.push(entry);
  return entry;
}

// Fetch a full synset (handles stub _indexOnly synsets in collab mode, or looks up in state).
// Pass force=true to bypass the cache and re-GET from the server (collab mode only) — used
// when the caller needs an up-to-date _nl_entries list after just having changed sense links.
async function _fetchFullSynset(id, force) {
  let ss = getSynset(id);
  if (ss && !ss._indexOnly && !force) return ss;
  if (!collabMode) {
    if (!ss) throw new Error('Synset not found: ' + id);
    return ss;
  }
  const r = await _authFetch('/api/synset/' + encodeURIComponent(id));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  ss = await r.json();
  delete ss._lock;
  const idx = state.synsets.findIndex(s => s.id === id);
  if (idx >= 0) state.synsets[idx] = ss; else state.synsets.push(ss);
  return ss;
}

// IDs of Dutch entries currently linked to a synset — from the server-computed
// _nl_entries list in collab mode, or by scanning loaded entries in standalone mode.
function _synonymIdsOf(ss, ssId) {
  return (ss && ss._nl_entries) ? ss._nl_entries.map(e => e.id) : getSynonymEntries(ssId).map(e => e.id);
}

// Clear the synset field of the sense whose Unlink button was clicked
function unlinkSense(btn) {
  const input = btn.closest('.field').querySelector('.s-synset');
  if (!input) return;
  input.value = '';
  updateSenseGloss(input);
  scheduleAutosave();
}

// Treat current input value as the synset link (called when sense has no synset yet)
function linkSense(btn) {
  const input = btn.closest('.field').querySelector('.s-synset');
  if (!input || !input.value.trim()) { input && input.focus(); return; }
  updateSenseGloss(input);
  scheduleAutosave();
}

// Remove the synset link from an entry's sense (called from Synonyms card)
async function unlinkSynonym(entryId, synsetId) {
  if (!confirm('Remove synset link from entry ' + entryId + '?')) return;
  let entry;
  try { entry = await _fetchFullEntry(entryId); }
  catch (err) { showToast('Could not load entry: ' + err.message, true); return; }
  let changed = false;
  for (const s of entry.senses || []) {
    if (s.synset === synsetId) { s.synset = ''; changed = true; }
  }
  if (!changed) { showToast('No sense found linking to this synset', true); return; }
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed', true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries) {
    ss._nl_entries = ss._nl_entries.filter(e => e.id !== entryId);
  }
  showToast('Synonym link removed');
  _refreshSynonymsCard(synsetId);
}

// Link an entry to this synset (sets its first sense's synset field)
async function addSynonym(synsetId) {
  const input = document.getElementById('syn-add-input');
  const entryId = input ? input.value.trim() : '';
  if (!entryId) { if (input) input.focus(); return; }
  let entry;
  try { entry = await _fetchFullEntry(entryId); }
  catch (err) { showToast('Entry not found: ' + entryId, true); return; }
  if (!entry.senses || !entry.senses.length) {
    showToast('Entry has no senses to link', true); return;
  }
  if (entry.senses.some(s => s.synset === synsetId)) {
    showToast('Entry already linked to this synset'); return;
  }
  entry.senses[0].synset = synsetId;
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed', true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entryId)) {
    ss._nl_entries.push({
      id: entryId,
      lemma: entry.isMWE ? (entry.mweForm || entryId) : (entry.lemma || entryId),
      partOfSpeech: entry.partOfSpeech || ''
    });
  }
  if (input) input.value = '';
  showToast('Synonym linked');
  _refreshSynonymsCard(synsetId);
}

let _ssmState = {};

function openSynSearch(synsetId) {
  _ssmState = { synsetId, query: '' };

}

function closeSynSearch() {
  document.getElementById('ssm-overlay').classList.remove('open');
}

function _ssmFoot(html) {
  document.getElementById('ssm-foot').innerHTML = html;
}

function _ssmShowSearch(query) {
  _ssmState.query = query;
  document.getElementById('ssm-title').textContent = 'Find word to add as synonym';
  document.getElementById('ssm-body').innerHTML = `
    <input type="text" id="ssm-q" placeholder="Type a written form…"
           value="${h(query)}"
           oninput="_ssmRunSearch(this.value)"
           onkeydown="if(event.key==='Escape')closeSynSearch()"
           style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin-bottom:10px">
    <div id="ssm-results"></div>`;
  _ssmFoot(`<button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
  setTimeout(() => {
    const inp = document.getElementById('ssm-q');
    if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = query.length; }
  }, 20);
  if (query) _ssmRunSearch(query);
}

function _ssmRunSearch(query) {
  _ssmState.query = query;
  const cont = document.getElementById('ssm-results');
  if (!cont) return;
  const q = query.trim().toLowerCase();
  if (!q) {
    cont.innerHTML = '<div style="color:#aaa;font-size:12px;padding:2px 0">Start typing to search entries…</div>';
    return;
  }
  const exact = [], prefix = [], sub = [];
  for (const e of state.entries) {
    const lemma = (e.isMWE ? (e.mweForm || '') : (e.lemma || '')).toLowerCase();
    if (!lemma) continue;
    if (lemma === q)              exact.push(e);
    else if (lemma.startsWith(q)) prefix.push(e);
    else if (lemma.includes(q))   sub.push(e);
  }
  const all = [...exact, ...prefix, ...sub];
  if (all.length === 0) {
    cont.innerHTML = `
      <div style="font-size:13px;color:#555;padding:4px 0">
        No entry found for "<strong>${h(query.trim())}</strong>".
      </div>`;
    _ssmFoot(`
      <button class="btn btn-pri" onclick="_ssmAskCreate(${JSON.stringify(query.trim())})">Create new entry</button>
      <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
    return;
  }
  _ssmFoot(`<button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
  const shown = all.slice(0, 20);
  cont.innerHTML = shown.map(e => {
    const lemma = e.isMWE ? (e.mweForm || e.id) : (e.lemma || e.id);
    return `<div class="ssm-result" onclick="_ssmSelectEntry('${h(e.id)}')">
      <span class="ssm-r-lemma">${h(lemma)}</span>
      <span class="ssm-r-pos">${h(e.partOfSpeech || '')}</span>
      <span class="ssm-r-id">${h(e.id)}</span>
    </div>`;
  }).join('') + (all.length > 20
    ? `<div style="color:#aaa;font-size:11px;padding:6px 2px">…${all.length - 20} more results hidden — type more to narrow down</div>`
    : '');
}

async function _ssmSelectEntry(entryId) {
  document.getElementById('ssm-title').textContent = 'Loading…';
  document.getElementById('ssm-body').innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px 0">Loading entry…</div>';
  _ssmFoot('');

  catch (err) {
    document.getElementById('ssm-body').innerHTML =
      `<div style="color:#c00;font-size:12px">Could not load entry: ${h(err.message)}</div>`;
    _ssmFoot(`<button class="btn btn-sec" onclick="_ssmShowSearch(${JSON.stringify(_ssmState.query)})">← Back</button>
              <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
    return;
  }

  _ssmShowSenses();
}

function _ssmShowSenses() {
  const { entry, synsetId } = _ssmState;
  const lemma = entry.isMWE ? (entry.mweForm || entry.id) : (entry.lemma || entry.id);
  document.getElementById('ssm-title').textContent = `Senses of "${lemma}"`;
  const senses = entry.senses || [];

  const rows = senses.map((s, i) => {
    const alreadyThis  = s.synset === synsetId;
    const otherSynset  = s.synset && !alreadyThis;
    const def = s.definition || '';
    const ssLabel = alreadyThis
      ? `<span style="color:#27ae60">✓ already linked to this synset</span>`
      : s.synset
      ? `<span style="color:#e67e22">→ ${h(s.synset)} (will be replaced)</span>`
      : `<span style="color:#bbb">no synset</span>`;
    const btn = alreadyThis
      ? `<button class="addbtn" disabled style="opacity:.4;flex-shrink:0">Linked</button>`
      : `<button class="addbtn" style="flex-shrink:0" onclick="_ssmLinkSense(${i})">Select</button>`;
    return `<div class="ssm-sense-row">
      <span class="ssm-sense-num">${h(String(s.senseId || (i + 1)))}</span>
      <div class="ssm-sense-info">
        <div class="ssm-sense-def">${def ? h(def) : '<em style="color:#bbb">no definition</em>'}</div>
        <div class="ssm-sense-ss">${ssLabel}</div>
      </div>
      ${btn}
    </div>`;
  }).join('');

  document.getElementById('ssm-body').innerHTML =
    (rows || '<div style="color:#aaa;font-size:12px;margin-bottom:10px">This entry has no senses yet.</div>') +
    `<button class="addbtn" style="width:100%;justify-content:center;padding:7px;margin-top:6px"
             onclick="_ssmAddNewSense()">+ Add new sense and link to this synset</button>`;

  _ssmFoot(`
    <button class="btn btn-sec" onclick="_ssmShowSearch(${JSON.stringify(_ssmState.query)})">← Back</button>
    <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
}

async function _ssmLinkSense(senseIdx) {
  const { entry, synsetId } = _ssmState;
  const sense = entry.senses[senseIdx];
  let oldSynsetId = '';
  if (sense.synset && sense.synset !== synsetId) {
    if (!confirm(`This sense is already linked to\n${sense.synset}\n\nReplace with ${synsetId}?`)) return;
    oldSynsetId = sense.synset;
  }
  sense.synset = synsetId;
  await _ssmSaveEntry(entry);
  if (oldSynsetId.startsWith('odwn')) await _maybeMergeOdwnSynset(oldSynsetId, synsetId);
}

// When a Dutch synonym is relinked away from an "odwn-" synset (onto e.g. an "eng-30-"
// synset), that odwn synset is being merged away. Walk the editor through retiring it:
// move any remaining synonyms across, offer to carry over its synset relations, and if
// nothing links to it anymore, mark it deprecated.
async function _maybeMergeOdwnSynset(oldId, newId) {
  if (!oldId || !oldId.startsWith('odwn') || oldId === newId) return;
  let oldSs;
  try { oldSs = await _fetchFullSynset(oldId, true); }
  catch (err) { showToast('Could not load ' + oldId + ': ' + err.message, true); return; }

  let others = _synonymIdsOf(oldSs, oldId);
  if (others.length && confirm(
      `${oldId} still has ${others.length} other Dutch synonym${others.length === 1 ? '' : 's'} linked to it:\n${others.join(', ')}\n\n` +
      `Move ${others.length === 1 ? 'it' : 'them'} to ${newId} as well?`)) {
    for (const eid of others) {
      let e;
      try { e = await _fetchFullEntry(eid); } catch (_) { continue; }
      let changed = false;
      for (const s of e.senses || []) if (s.synset === oldId) { s.synset = newId; changed = true; }
      if (!changed) continue;
      if (collabMode) await _pushUpdate('update', 'entry', e, true);
      state.modified = true;
      const nss = getSynset(newId);
      if (nss && nss._nl_entries && !nss._nl_entries.some(x => x.id === e.id)) {
        nss._nl_entries.push({ id: e.id, lemma: e.isMWE ? (e.mweForm || e.id) : (e.lemma || e.id), partOfSpeech: e.partOfSpeech || '', examples: [] });
      }
    }
    _refreshSynonymsCard(newId);
    try { oldSs = await _fetchFullSynset(oldId, true); } catch (_) {}
    others = _synonymIdsOf(oldSs, oldId);
    showToast('Moved synonym(s) to ' + newId);
  }

  const rels = (oldSs.synsetRelations || []).filter(r => r.target && r.target !== newId);
  if (rels.length && confirm(`Transfer the ${rels.length} synset relation(s) of ${oldId} to ${newId}?`)) {
    collectEditorState();
    const newSs = getSynset(newId);
    if (newSs) {
      let added = 0;
      for (const r of rels) {
        const dup = newSs.synsetRelations.some(x => x.relType === r.relType && x.target === r.target);
        if (!dup) { newSs.synsetRelations.push({ relType: r.relType, target: r.target, provenance: r.provenance || '' }); added++; }
      }
      state.modified = true;
      if (state.selectedSynsetId === newId) renderSynsetEditor();
      if (collabMode) await _pushUpdate('update', 'synset', newSs, true);
      showToast(added ? `Transferred ${added} relation(s) to ${newId}` : 'No new relations to transfer');
    }
  }

  if (!others.length && oldSs.status !== 'DEPRECATED' && confirm(
      `${oldId} now has no Dutch synonyms left.\n\nMark it as deprecated (merged into ${newId})?`)) {
    oldSs.status = 'DEPRECATED';
    oldSs.comment = (oldSs.comment ? oldSs.comment + '; ' : '') + `merged into ${newId}`;
    state.modified = true;
    if (collabMode) await _pushUpdate('update', 'synset', oldSs, true);
    if (state.selectedSynsetId === oldId) renderSynsetEditor();
    showToast(oldId + ' marked as deprecated');
  }
}

async function _ssmAddNewSense() {
  const { entry, synsetId } = _ssmState;
  const maxId = Math.max(0, ...(entry.senses || []).map(s => parseInt(s.senseId) || 0));
  const ns = makeSense();
  ns.senseId = String(maxId + 1);
  ns.synset  = synsetId;
  entry.senses.push(ns);
  await _ssmSaveEntry(entry);
}

async function _ssmSaveEntry(entry) {
  const { synsetId } = _ssmState;
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed: HTTP ' + resp.status, true); return; }
    } catch (err) { showToast('Error saving: ' + err.message, true); return; }
  }
  // Keep _nl_entries on the synset up to date
  const ss = getSynset(synsetId);
  const lemma = entry.isMWE ? (entry.mweForm || entry.id) : (entry.lemma || entry.id);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entry.id)) {
    ss._nl_entries.push({ id: entry.id, lemma, partOfSpeech: entry.partOfSpeech || '' });
  }
  showToast('Synonym linked');
  closeSynSearch();
  _refreshSynonymsCard(synsetId);
}

async function _ssmCreateEntry(word) {
  const { synsetId } = _ssmState;
  const pos = document.getElementById('ssm-pos')?.value || 'noun';
  const abbr = { noun:'n', verb:'v', adjective:'a', adverb:'r', other:'o' }[pos] || 'n';
  let n = 1;
  while (state.entries.some(e => e.id === `${word}-${abbr}-${n}`)) n++;
  const entryId = `${word}-${abbr}-${n}`;
  const ns = makeSense();
  ns.senseId = '1';
  ns.synset  = synsetId;
  const entry = {
    id: entryId, lemma: word, partOfSpeech: pos,
    isMWE: false, mweForm: '', mweExpressionType: '', lemmaMode: '', formType: '',
    wordForms: [], relatedForms: [], senses: [ns], status: '', comment: '',
    morphology: { morphoType:'', comparisonType:'', declinable:'', separability:'' },
    morphoSyntax: { pronominalAndGrammaticalGender:'', adverbialUsage:'', position:'', reflexivity:'', auxiliaries:[] },
    syntacticBehaviour: { valency:'', transitivity:'', complementations:[], subcatFrames:[] }
  };
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'add', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Create failed: HTTP ' + resp.status, true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  state.entries.unshift(entry);
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entryId)) {
    ss._nl_entries.push({ id: entryId, lemma: word, partOfSpeech: pos });
  }
  showToast(`Entry "${entryId}" created and linked`);
  closeSynSearch();
  rebuildVSE(); rebuildVSS();
  _refreshSynonymsCard(synsetId);
}

function _nextOdwn20Id(posAbbr) {
  let max = 0;
  const re = /^odwn-20-(\d+)-[a-z]+$/;
  for (const s of state.synsets) {
    const m = re.exec(s.id);
    if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; }
  }
  return `odwn-20-${String(max + 1).padStart(9, '0')}-${posAbbr}`;
}

function buildCompRow(c) {
  return `<div class="irow comp-row">
    <select class="comp-compl" style="flex:2">${sel(COMPLEMENT_OPTS, c.complement)}</select>
    <input type="text" class="comp-prep grow" value="${h(c.preposition)}" placeholder="preposition…">
    <button class="delbtn" onclick="this.closest('.comp-row').remove()">&#x2715;</button>
  </div>`;
}

function addComp() {
  const con = document.getElementById('comp-con'); if (!con) return;
  con.querySelector('.empty-msg')?.remove();
  con.insertAdjacentHTML('beforeend', buildCompRow({ complement: '', preposition: '' }));
}

function buildSensesCard(entry) {
  return `<div class="card">
    <div class="card-hd">Senses <button class="addbtn" onclick="addSense()">+ Add</button></div>
    <div id="senses-con">${entry.senses.map((s, i) => buildSenseBlock(s, i, entry.senses.length)).join('')}</div>
  </div>`;
}

function buildSenseBlock(sense, idx, total) {
  // Synset gloss for the linked synset
  const _ss = sense.synset ? getSynset(sense.synset) : null;
  const _ssGloss = _ss && _ss.definitions && _ss.definitions.length ? _ss.definitions[0].gloss : '';

  // Semantics-noun section
  const snHTML = sense.semanticsNoun !== null ? `
    <div class="row">
      <div class="field"><label>Reference</label><select class="sn-ref">${sel(SN_REF_OPTS, sense.semanticsNoun.reference)}</select></div>
      <div class="field"><label>Countability</label><select class="sn-count">${sel(SN_COUNT_OPTS, sense.semanticsNoun.countability)}</select></div>
      <div class="field"><label>Semantic Type</label><select class="sn-semtype">${sel(SN_SEMTYPE_OPTS, sense.semanticsNoun.semanticType)}</select></div>
      <div class="field"><label>Sub Type</label><input type="text" class="sn-subtype" value="${h(sense.semanticsNoun.semanticSubType)}"></div>
    </div>
    <div class="sublabel">Semantic Shifts <button class="addbtn" onclick="addSNShift(this)">+ Add</button></div>
    <div class="snshift-list">${(sense.semanticsNoun.shifts||[]).map(sh => `<div class="irow snshift-row"><select class="snshift-type grow">${sel(SN_SEMTYPE_OPTS, sh.semanticType)}</select><button class="delbtn" onclick="this.closest('.snshift-row').remove()">&#x2715;</button></div>`).join('') || '<div class="empty-msg">None.</div>'}</div>` : '';

  // Semantics-verb section
  const svHTML = sense.semanticsVerb !== null ? `
    <div class="svtype-list">${(sense.semanticsVerb.semanticTypes||[]).map(t => buildSVTypeRow(t)).join('') || '<div class="empty-msg sv-empty">No types.</div>'}</div>
    <button class="addbtn" onclick="addSVType(this)">+ Add Type</button>` : '';

  // Semantics-adj section
  const saHTML = sense.semanticsAdj !== null ? `
    <div class="field"><label>Semantic Type</label><select class="sa-semtype">${sel(SA_SEMTYPE_OPTS, sense.semanticsAdj.semanticType)}</select></div>
    <div class="sublabel">Semantic Shifts <button class="addbtn" onclick="addSAShift(this)">+ Add</button></div>
    <div class="sashift-list">${(sense.semanticsAdj.shifts||[]).map(sh => `<div class="irow sashift-row"><select class="sashift-type grow">${sel(SA_SEMTYPE_OPTS, sh.semanticType)}</select><button class="delbtn" onclick="this.closest('.sashift-row').remove()">&#x2715;</button></div>`).join('') || '<div class="empty-msg">None.</div>'}</div>` : '';

  return `<div class="sblock" id="sb-${h(sense.id)}" data-sid="${h(sense.id)}">
    <div class="sblock-hd">
      <span class="snum">Sense ${idx + 1}</span>
      <span class="sid-tag">${h(sense.id)}</span>
      ${total > 1 ? `<button class="addbtn" style="border-color:#e74c3c;color:#e74c3c" onclick="removeSense(this)">Remove</button>` : ''}
    </div>
    <div class="row">
      <div class="field w3"><label>Definition</label><textarea class="s-def" rows="2" placeholder="Enter definition…">${h(sense.definition)}</textarea></div>
      <div class="field"><label>Sense ID</label><input type="text" class="s-senseid" value="${h(sense.senseId)}"></div>
    </div>
    <div class="row">
      <div class="field w2"><label>Synset <span style="font-size:10px;color:#aaa;font-weight:400">(type ID or paste, then Save)</span></label>
        <div style="display:flex;gap:4px">
          <input type="text" class="s-synset" style="flex:1;min-width:0" value="${h(sense.synset)}" placeholder="e.g. eng-30-06952861-n" oninput="updateSenseGloss(this)">
          ${sense.synset ? `<button class="addbtn" onclick="jumpToSynset(this.previousElementSibling.value)" title="Open in Synsets panel" style="white-space:nowrap;flex-shrink:0">&#x2197; Open</button>` : ''}
          ${sense.synset ? `<button class="addbtn" style="border-color:#e74c3c;color:#e74c3c;white-space:nowrap;flex-shrink:0" onclick="unlinkSense(this)" title="Remove synset link">Unlink</button>` : `<button class="addbtn" style="white-space:nowrap;flex-shrink:0" onclick="linkSense(this)" title="Set synset from input">Link</button>`}
        </div>
        ${_ssGloss ? `<div class="sense-gloss">${h(_ssGloss)}</div>` : `<div class="sense-gloss" style="display:none"></div>`}
      </div>
      <div class="field"><label>Provenance</label><input type="text" class="s-prov" value="${h(sense.provenance)}"></div>
      <div class="field"><label>Annotator</label><input type="text" class="s-annot" value="${h(sense.annotator)}"></div>
    </div>

    <div class="sublabel">Sense Relations <button class="addbtn" onclick="addSR(this)">+ Add</button></div>
    <div class="sr-list">${sense.senseRelations.map(sr => `<div class="irow sr-row">
      <select class="sr-type" style="min-width:120px">${sel(SR_TYPE_OPTS, sr.relationType)}</select>
      <input type="text" class="sr-tgt grow" value="${h(sr.targetSenseId)}" placeholder="Target sense ID…">
      <button class="delbtn" onclick="this.closest('.sr-row').remove()">&#x2715;</button>
    </div>`).join('') || '<div class="empty-msg sr-empty">None.</div>'}</div>

    <details>
      <summary>Semantics-noun
        ${sense.semanticsNoun === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSN(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSN(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sn-section">${snHTML}</div>
    </details>

    <details>
      <summary>Semantics-verb
        ${sense.semanticsVerb === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSV(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSV(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sv-section" ${sense.semanticsVerb !== null ? 'data-present="1"' : ''}>${svHTML}</div>
    </details>

    <details>
      <summary>Semantics-adjective
        ${sense.semanticsAdj === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSA(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSA(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sa-section">${saHTML}</div>
    </details>

    <details>
      <summary>Pragmatics</summary>
      <div class="row" style="padding-top:8px">
        <div class="field"><label>Chronology</label><select class="prag-chron">${sel(CHRONOLOGY_OPTS, sense.pragmatics.chronology)}</select></div>
        <div class="field"><label>Connotation</label><select class="prag-conn">${sel(CONNOTATION_OPTS, sense.pragmatics.connotation)}</select></div>
        <div class="field"><label>Geography</label><select class="prag-geo">${sel(GEOGRAPHY_OPTS, sense.pragmatics.geography)}</select></div>
        <div class="field"><label>Register</label><select class="prag-reg">${sel(REGISTER_OPTS, sense.pragmatics.register)}</select></div>
      </div>
      <div class="sublabel">Domains <button class="addbtn" onclick="addDomain(this)">+ Add</button></div>
      <div class="dom-list">${sense.pragmatics.domains.map(d => buildDomainRow(d)).join('') || '<div class="empty-msg dom-empty">None.</div>'}</div>
    </details>

    <details>
      <summary>Sense Examples <button class="addbtn" onclick="event.preventDefault();addExample(this)" style="margin-left:8px">+ Add</button></summary>
      <div class="ex-list">${sense.examples.map(ex => buildExRow(ex)).join('') || '<div class="empty-msg ex-empty">None.</div>'}</div>
    </details>

    <details>
      <summary>Sentiment
        ${sense.sentiment === null ? `<button class="addbtn" onclick="event.preventDefault();toggleSentiment(this,true)" style="margin-left:8px">+ Add</button>` : `<button class="addbtn" onclick="event.preventDefault();toggleSentiment(this,false)" style="margin-left:8px">Remove</button>`}
      </summary>
      <div class="sent-section">${sense.sentiment ? buildSentimentFields(sense.sentiment) : ''}</div>
    </details>
  </div>`;
}

function buildSVTypeRow(t) {
  return `<div class="irow svtype-row">
    <select class="sv-semtype" style="min-width:100px">${sel(SV_SEMTYPE_OPTS, t.semanticType)}</select>
    <input type="text" class="sv-featset grow" value="${h(t.semanticFeatureSet)}" placeholder="semanticFeatureSet…">

  return `<div class="row" style="padding-top:8px">

// ── Sense mutations ───────────────────────────────────────────────────

function addSense() { collectEditorState(); const e = getEntry(state.selectedId); if (!e) return; e.senses.push(makeSense()); renderEditor(); }
function removeSense(btn) { if (!confirm('Remove?')) return; btn.closest('.sblock').remove(); }

function toggleSN(btn, add) {
  const sec = btn.closest('details').querySelector('.sn-section');
  if (add) {
    sec.innerHTML = buildSenseBlock({ semanticsNoun: { reference:'',countability:'',semanticType:'',semanticSubType:'',shifts:[] }, pragmatics:{}, senseRelations:[], examples:[] }, 0, 1).match(/class="sn-section">([\s\S]*?)<\/div>\s*<\/details>/)?.[1] || '';
    sec.innerHTML = `<div class="row"><div class="field"><label>Reference</label><select class="sn-ref">${sel(SN_REF_OPTS,'')}</select></div><div class="field"><label>Countability</label><select class="sn-count">${sel(SN_COUNT_OPTS,'')}</select></div><div class="field"><label>Semantic Type</label><select class="sn-semtype">${sel(SN_SEMTYPE_OPTS,'')}</select></div><div class="field"><label>Sub Type</label><input type="text" class="sn-subtype"></div></div><div class="sublabel">Semantic Shifts <button class="addbtn" onclick="addSNShift(this)">+ Add</button></div><div class="snshift-list"><div class="empty-msg">None.</div></div>`;
    btn.textContent = 'Remove'; btn.setAttribute('onclick', "event.preventDefault();toggleSN(this,false)");
  } else {
    sec.innerHTML = ''; btn.textContent = '+ Add'; btn.setAttribute('onclick', "event.preventDefault();toggleSN(this,true)");

// ── Overview panel (grouped entry view) ──────────────────────────────

function buildOverviewHTML(entryIds) {
  const items = entryIds.map(id => getEntry(id)).filter(Boolean);
  if (!items.length) return '';
  const rawLemma = items[0].isMWE ? items[0].mweForm : items[0].lemma;
  const label = h(rawLemma) || '—';

  // Sort by senseId (numeric if possible, else lexicographic)
  items.sort((a, b) => {
    const sa = (a.senses && a.senses.length) ? (a.senses[0].senseId || '') : '';
    const sb = (b.senses && b.senses.length) ? (b.senses[0].senseId || '') : '';
    const na = parseFloat(sa), nb = parseFloat(sb);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return sa.localeCompare(sb);
  });

  let rows = '';
  for (const e of items) {
    const senses = e.senses && e.senses.length ? e.senses : [];
    const s = senses[0] || null;

    // All sense definitions joined with ";"
    const defText = senses.map(x => x.definition).filter(Boolean).join('; ') || '—';

    // Synset from first sense; English-only glosses joined with ";"
    const ss = (s && s.synset) ? getSynset(s.synset) : null;
    const enGlosses = ss && ss.definitions
      ? ss.definitions.filter(d => (d.language || '').toLowerCase().startsWith('en')).map(d => d.gloss).filter(Boolean)
      : [];
    const glossText = enGlosses.length ? enGlosses.join('; ') : '';

    const synCell = (s && s.synset)
      ? `<span class="ov-synlink" onclick="event.stopPropagation();jumpToSynset('${h(s.synset)}')">${h(s.synset)}</span>`
      : '—';
    rows += `<tr class="ov-row" onclick="selectEntry('${h(e.id)}')">
      <td>${h(e.isMWE ? e.mweForm : e.lemma)}</td>
      <td class="ov-id">${h(e.id)}</td>
      <td>${h(e.partOfSpeech || '—')}</td>
      <td class="ov-id">${s ? h(s.senseId || '—') : '—'}</td>
      <td class="ov-def">${h(defText)}</td>
      <td class="ov-id">${synCell}</td>
      <td class="ov-def">${h(glossText) || '—'}</td>
    </tr>`;
  }
  return `
  <div class="ed-hd">
    <h2>${label}</h2>
    <span class="pill pill-blue">${items.length} entr${items.length === 1 ? 'y' : 'ies'}</span>
    <span style="font-size:12px;color:#aaa;margin-left:6px">— click a row to edit</span>
  </div>
  <div class="card">
    <div class="card-hd">Senses <button class="addbtn" onclick="openNewEntryDialog(${JSON.stringify(rawLemma)})">+ Add sense</button></div>
    <div style="overflow-x:auto">
      <table class="ov-table">
        <thead><tr><th>Form</th><th>Entry ID</th><th>POS</th><th>Sense ID</th><th>Definition</th><th>Synset</th><th>Synset gloss</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function selectEntry(id) {
  state.selectedGroupIds = null;
  state.selectedId = id;
  // In collab mode the entry may be a stub — use window.selectItem to lazy-load
  if (typeof collabMode !== 'undefined' && collabMode) {
    const e = getEntry(id);
    if (e && e._indexOnly) {
      fetch('/api/entry/' + encodeURIComponent(id))
        .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
        .then(full => { const idx = state.entries.findIndex(x => x.id === id); if (idx >= 0) state.entries[idx] = full; renderVS(); renderEditor(); document.getElementById('editor').scrollTop = 0; })
        .catch(err => { showToast('Could not fetch: ' + err, true); renderVS(); renderEditor(); document.getElementById('editor').scrollTop = 0; });
      return;
    }
  }
  renderVS(); renderEditor();
  document.getElementById('editor').scrollTop = 0;
}

// Build a synsetId → [{id, lemma, partOfSpeech, isMWE}] map from loaded entries
function getSynonymEntries(synsetId) {
  const results = [];
  for (const e of state.entries) {
    if (e._indexOnly) continue; // not yet fetched in collab mode
    for (const s of (e.senses || [])) {
      if (s.synset === synsetId) {
        results.push({ id: e.id, lemma: e.isMWE ? e.mweForm : e.lemma, partOfSpeech: e.partOfSpeech, isMWE: e.isMWE });
        break;
      }
    }
  }
  return results;
}

function buildEnSynonymsCard(ss) {

  return `<div class="card">

    <div class="en-syns-list">${pills}</div>

}

function buildSynonymsCard(ss) {

function jumpToSynset(synsetId) {
  if (!synsetId) return;
  collectEditorState();
  state.mode = 'synsets';
  state.filter = '';
  state.selectedGroupIds = null;
  document.getElementById('search').value = '';
  document.getElementById('tab-entries').classList.remove('active');
  document.getElementById('tab-synsets').classList.add('active');
  document.getElementById('add-btn').textContent = '+ Add Synset';
  rebuildVS();
  const ss = getSynset(synsetId);
  if (!ss) { showToast('Synset not found: ' + synsetId, true); renderVS(true); renderEditor(); return; }
  scrollVSToId(synsetId);
  updateStatusBar();
  if (collabMode) {
    // Always fetch full data via selectItem — stub has empty synsetRelations and
    // rendering it would let collectSynsetState wipe relations from the database.
    state.selectedId = null; // reset so selectItem doesn't early-return on same id
    window.selectItem(synsetId);
  } else {
    state.selectedId = synsetId;
    renderVS(true);
    renderEditor();
  }
}

function jumpToEntry(entryId) {
  if (!entryId) return;
  collectEditorState();
  state.mode = 'entries';
  state.filter = '';
  document.getElementById('search').value = '';
  document.getElementById('tab-entries').classList.add('active');
  document.getElementById('tab-synsets').classList.remove('active');
  document.getElementById('add-btn').textContent = '+ Add Entry';
  rebuildVS();
  const e = getEntry(entryId);
  if (!e) { showToast('Entry not found: ' + entryId, true); renderVS(true); renderEditor(); return; }
  scrollVSToId(entryId);
  updateStatusBar();
  if (collabMode) {
    state.selectedId = null; // reset so selectItem doesn't early-return on same id
    window.selectItem(entryId);
  } else {
    state.selectedId = entryId;
    renderVS(true);
    renderEditor();
  }
}

function scrollVSToId(id) {
  const listEl = document.getElementById('entry-list');
  const src = state.mode === 'entries' ? state.entries : state.synsets;
  const vsIdx = vsFiltered.findIndex(i => src[i] && src[i].id === id);
  if (vsIdx < 0) return;
  const targetY = vsIdx * ITEM_H;
  const viewH = listEl.clientHeight || 600;
  if (targetY < listEl.scrollTop || targetY + ITEM_H > listEl.scrollTop + viewH) {
    listEl.scrollTop = Math.max(0, targetY - viewH / 2 + ITEM_H / 2);
  }
  _paintVS(listEl);
}

// =====================================================================
// COLLABORATIVE MODE
// =====================================================================

let collabMode = false;
let collabSeq  = 0;
let collabUser = '';
let collabCache = { entries: {}, synsets: {} };
let collabSaveTimer = null;
let collabLock = null;        // { user, expires_at, is_mine, item_type, item_id } or null
let _lockCountdownTimer = null;

// Auth state
let lmf_token    = localStorage.getItem('lmf_token')    || '';
let lmf_username = localStorage.getItem('lmf_username') || '';

function _authFetch(url, opts = {}) {
  if (lmf_token) {
    opts.headers = Object.assign({ 'X-Session-Token': lmf_token }, opts.headers || {});
  }
  return fetch(url, opts);
}

function getOrSetUser() {
  collabUser = lmf_username || 'anon';
  return collabUser;
}

async function initCollab() {
  try {
    const resp = await fetch('/api/status', { signal: AbortSignal.timeout(1500) });
    if (!resp.ok) return;
    collabMode = true;

    // Validate stored session
    if (lmf_token) {
      try {
        const w = await _authFetch('/api/whoami');
        if (w.ok) {
          const wj = await w.json();
          lmf_username = wj.username;
          localStorage.setItem('lmf_username', lmf_username);
          getOrSetUser();
          await _afterLogin();
          return;
        }
      } catch (_) {}
      // Token invalid — clear it
      lmf_token = '';
      localStorage.removeItem('lmf_token');
    }

    // No valid session — show login form
    _showLoginOverlay();
  } catch (_) {
    // No server running — standalone mode
  }
}

function _showLoginOverlay() {
  const ov = document.getElementById('login-overlay');
  if (ov) { ov.classList.add('active'); document.getElementById('login-user').focus(); }
  // Allow Enter key in password field
  const pw = document.getElementById('login-pass');
  if (pw) pw.onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  const u = document.getElementById('login-user');
  if (u)  u.onkeydown = e => { if (e.key === 'Enter') document.getElementById('login-pass').focus(); };
}

async function doLogin() {
  const usernameEl = document.getElementById('login-user');
  const passwordEl = document.getElementById('login-pass');
  const errEl      = document.getElementById('login-err');
  const btn        = document.getElementById('login-btn');
  const username   = usernameEl.value.trim();
  const password   = passwordEl.value;
  if (!username || !password) {
    errEl.textContent = 'Please enter your username and password.';
    errEl.style.display = 'block'; return;
  }
  btn.disabled = true; btn.textContent = 'Signing in…';
  errEl.style.display = 'none';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const res = await resp.json();
    if (!resp.ok) {
      errEl.textContent = res.error || 'Login failed.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
      passwordEl.value = ''; passwordEl.focus();
      return;
    }
    lmf_token    = res.token;
    lmf_username = res.username;
    localStorage.setItem('lmf_token',    lmf_token);
    localStorage.setItem('lmf_username', lmf_username);
    getOrSetUser();
    document.getElementById('login-overlay').classList.remove('active');
    btn.disabled = false; btn.textContent = 'Sign in';
    await _afterLogin();
  } catch (err) {
    errEl.textContent = 'Connection error: ' + err.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function doLogout() {
  try {
    await _authFetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  } catch (_) {}
  localStorage.removeItem('lmf_token');
  localStorage.removeItem('lmf_username');
  window.location.reload();
}

async function _afterLogin() {
  const status = await (await fetch('/api/status')).json().catch(() => ({}));
  _updateCollabDot(true, status.active_users || 1);
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.style.display = 'inline-block';
  const tbUser = document.getElementById('tb-username');

async function fetchIndex() {
  showLoading('Loading index from server…');
  try {
    const resp = await _authFetch('/api/index');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    collabSeq        = data.seq || 0;
    state.globalInfo = data.globalInfo || state.globalInfo;
    state.lexicon    = data.lexicon    || state.lexicon;
    state.filename   = data.filename   || state.filename;
    // Build lightweight index stubs for virtual scrolling
    state.entries = (data.entry_index || []).map(ei => ({
      id: ei.id, lemma: ei.lemma || '', partOfSpeech: ei.partOfSpeech || '',
      isMWE: !!ei.isMWE, mweForm: ei.mweForm || '', hasMissingSynset: !!ei.hasMissingSynset, _indexOnly: true,
      // stub fields needed by serializer/collectEditorState (never serialized in collab mode)
      wordForms: [], relatedForms: [], senses: [],
      morphology: { morphoType:'', comparisonType:'', declinable:'', separability:'' },
      morphoSyntax: { pronominalAndGrammaticalGender:'', adverbialUsage:'', position:'', reflexivity:'', auxiliaries:[] },
      syntacticBehaviour: { valency:'', transitivity:'', complementations:[], subcatFrames:[] }
    }));
    state.synsets = (data.synset_index || []).map(si => ({
      id: si.id, ili: '', baseConcept: '', _indexOnly: true,
      definitions: si.gloss ? [{ gloss: si.gloss, language: '', provenance: '' }] : [],
      enSyns: si.enSyns || '',
      synsetRelations: [], monolingualExternalRefs: []
    }));
    state.modified = false;
    state.selectedId = null;
    hideLoading();
    renderAll();
    showToast('Connected — ' + state.entries.length + ' entries, ' + state.synsets.length + ' synsets');
  } catch (err) {
    hideLoading();
    showToast('Could not load index: ' + err.message, true);
  }
}

// Override selectItem to fetch full data lazily from server
const _selectItemOrig = selectItem;
window.selectItem = async function(id) {
  if (!collabMode) { _selectItemOrig(id); return; }
  const grp = vsGroups[id];
  if (grp && state.selectedGroupIds && state.selectedGroupIds[0] === id) return;
  if (!grp && state.selectedId === id && !state.selectedGroupIds) return;

  // Release lock on current item before switching
  if (!state.selectedGroupIds && state.selectedId && collabLock && collabLock.is_mine) {
    _releaseLock(collabLock.item_type, state.selectedId);
  }
  collabLock = null;
  _updateLockBanner();

  // Flush current edits before switching
  if (!state.selectedGroupIds && state.selectedId) {
    collectEditorState();
    await _pushUpdate();
  }
  state.selectedId = id;
  renderVS();

  if (grp && grp.length > 1) {
    const groupIds = grp.map(i => state.entries[i].id);
    state.selectedGroupIds = groupIds;
    await Promise.all(groupIds.map(async gid => {
      const e = getEntry(gid);
      if (e && e._indexOnly) {
        try {
          const r = await _authFetch('/api/entry/' + encodeURIComponent(gid));
          if (r.ok) { const full = await r.json(); delete full._lock; const idx = state.entries.findIndex(x => x.id === gid); if (idx >= 0) state.entries[idx] = full; }
        } catch (_) {}
      }
    }));
    renderEditor();
    document.getElementById('editor').scrollTop = 0;
    return;
  }

  state.selectedGroupIds = null;
  const item = state.mode === 'entries' ? getEntry(id) : getSynset(id);
  const needFetch = item && item._indexOnly;
  try {
    const itype = state.mode === 'entries' ? 'entry' : 'synset';
    const base  = state.mode === 'entries' ? '/api/entry/' : '/api/synset/';
    const url   = base + encodeURIComponent(id);
    if (needFetch || true) { // always re-fetch to get fresh lock state
      const resp = await _authFetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const full = await resp.json();
      // Extract and store lock info, then remove it from the data object
      if (full._lock) {
        collabLock = { ...full._lock, item_type: itype, item_id: id };
        delete full._lock;
      }
      if (state.mode === 'entries') {
        const idx = state.entries.findIndex(e => e.id === id);
        if (idx >= 0) state.entries[idx] = full;
      } else {
        const idx = state.synsets.findIndex(s => s.id === id);
        if (idx >= 0) state.synsets[idx] = full;
      }
    }
  } catch (err) {
    showToast('Could not fetch item: ' + err.message, true);
  }
  _updateLockBanner();
  renderEditor();
  document.getElementById('editor').scrollTop = 0;
};

// Override addItem to POST new item to server
const _addItemOrig = addItem;
window.addItem = async function() {
  if (state.mode === 'entries') { openNewEntryDialog(); return; }
  _addItemOrig(); // synsets branch only
  if (!collabMode) return;
  const id = state.selectedId;
  const data = getSynset(id);
  if (data) await _pushUpdate('add', 'synset', data);
};

// Override deleteItem to also POST delete to server
window.deleteItem = async function(id) {
  if (!confirm('Delete?')) return;
  const itemType = state.mode === 'entries' ? 'entry' : 'synset';
  if (state.mode === 'entries') {
    state.entries = state.entries.filter(e => e.id !== id);
    state.selectedId = state.entries.length ? state.entries[0].id : null;
  } else {
    state.synsets = state.synsets.filter(s => s.id !== id);
    state.selectedId = state.synsets.length ? state.synsets[0].id : null;
  }
  state.modified = true;
  rebuildVS(); renderVS(); renderEditor(); updateStatusBar();
  if (collabMode) await _pushUpdate('delete', itemType, { id });
};

// Override duplicateEntry to POST copy to server
const _duplicateEntryOrig = duplicateEntry;
window.duplicateEntry = async function(id) {
  _duplicateEntryOrig(id);
  if (!collabMode) return;
  const copy = getEntry(state.selectedId);
  if (copy) await _pushUpdate('add', 'entry', copy);
};


// Debounced autosave triggered by editor input events
function scheduleAutosave() {
  const btn = document.getElementById('save-btn');
  if (btn) btn.disabled = false;
  if (!collabMode || !state.selectedId) return;
  clearTimeout(collabSaveTimer);
  setAutosaveStatus('Saving…');
  collabSaveTimer = setTimeout(async () => {
    collectEditorState();
    await _pushUpdate();
  }, 1500);
}

async function _pushUpdate(op, itemType, data, explicit) {
  op       = op       || 'update';
  itemType = itemType || (state.mode === 'entries' ? 'entry' : 'synset');
  if (!data) data = state.mode === 'entries' ? getEntry(state.selectedId) : getSynset(state.selectedId);
  if (!data || data._indexOnly) return;
  try {
    const resp = await _authFetch('/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op, itemType, data, user: collabUser, explicit: !!explicit })
    });
    if (resp.status === 423) {
      const res = await resp.json();
      const holder = res.lock ? res.lock.user : 'someone else';
      setAutosaveStatus('Locked by ' + holder, true);
      showToast('Save blocked — ' + holder + ' is editing this item', true);
      if (res.lock) {
        collabLock = { ...res.lock, item_type: itemType, item_id: data.id, is_mine: false };
        _updateLockBanner();
      }
      return;
    }
    if (resp.ok) {
      const res = await resp.json();
      if (res.seq) collabSeq = res.seq;
      // Sync server-assigned _changes back onto the local item so the history popup stays current
      if (res.changes && op === 'update' && data) data._changes = res.changes;
      setAutosaveStatus('Saved');
    } else {
      setAutosaveStatus('Save error', true);
    }
  } catch (_) {
    setAutosaveStatus('Offline?', true);
  }
}

function _releaseLock(itemType, itemId) {
  if (!itemType || !itemId) return;
  // Use sendBeacon for reliability on page unload (token in body since sendBeacon has no custom headers)
  const body = JSON.stringify({ itemType, itemId, user: collabUser, token: lmf_token });
  if (navigator.sendBeacon) {
    navigator.sendBeacon('/api/unlock', new Blob([body], { type: 'application/json' }));
  } else {
    fetch('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Token': lmf_token }, body }).catch(() => {});
  }
}

function _updateLockBanner() {
  clearInterval(_lockCountdownTimer);
  const banner   = document.getElementById('lock-banner');
  const lockUser = document.getElementById('lock-user');
  const lockTtl  = document.getElementById('lock-ttl');
  const editor   = document.getElementById('ed-content');
  if (!banner) return;

  if (!collabLock || collabLock.is_mine) {
    banner.style.display = 'none';
    if (editor) editor.querySelectorAll('input,select,textarea,button.addbtn,.btn-red').forEach(el => el.disabled = false);
    return;
  }

  banner.style.display = 'flex';
  if (lockUser) lockUser.textContent = collabLock.user;

  function updateTtl() {
    const secs = Math.max(0, Math.round(collabLock.expires_at - Date.now() / 1000));
    if (lockTtl) lockTtl.textContent = secs > 0 ? `lock expires in ${secs}s` : 'lock expired — click Claim';
    if (editor) editor.querySelectorAll('input,select,textarea').forEach(el => el.disabled = true);
  }
  updateTtl();
  _lockCountdownTimer = setInterval(() => {
    updateTtl();
    if (collabLock && Date.now() / 1000 > collabLock.expires_at) clearInterval(_lockCountdownTimer);
  }, 1000);
}

function claimLock() {
  if (!state.selectedId) return;
  // Re-fetch the item, which will attempt lock acquisition
  const id = state.selectedId;
  state.selectedId = null;  // force re-fetch even though same id
  window.selectItem(id);
}

// Poll for remote changes every 3 seconds
async function pollChanges() {
  try {
    const resp = await _authFetch('/api/changes?since=' + collabSeq);
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.changes && data.changes.length) {
      for (const ch of data.changes) applyChange(ch);
      collabSeq = data.changes[data.changes.length - 1].seq;
    }
    if (data.active_users !== undefined) _updateCollabDot(true, data.active_users);
  } catch (_) { /* network hiccup */ }
}

function applyChange(ch) {
  if (ch.user === collabUser) return; // own change already reflected locally
  const { op, itemType, data } = ch;

  if (itemType === 'entry') {
    if (op === 'delete') {
      state.entries = state.entries.filter(e => e.id !== data.id);
      if (state.selectedId === data.id) { state.selectedId = null; renderEditor(); }
    } else {
      const idx = state.entries.findIndex(e => e.id === data.id);
      if (idx >= 0) {
        state.entries[idx] = data;
        if (state.selectedId === data.id && state.mode === 'entries') renderEditor();
      } else {
        state.entries.unshift(data);
      }
    }
  } else if (itemType === 'synset') {
    if (op === 'delete') {
      state.synsets = state.synsets.filter(s => s.id !== data.id);
      if (state.selectedId === data.id) { state.selectedId = null; renderEditor(); }
    } else {
      const idx = state.synsets.findIndex(s => s.id === data.id);
      if (idx >= 0) {
        state.synsets[idx] = data;
        if (state.selectedId === data.id && state.mode === 'synsets') renderEditor();
      } else {
        state.synsets.unshift(data);
      }
    }
  } else if (itemType === 'lexicon') {
    if (data.globalInfo) state.globalInfo = data.globalInfo;
    if (data.lexicon)    state.lexicon    = data.lexicon;
    updateStatusBar();
  }

  rebuildVS(); renderVS();
  if (collabMode) _updateLockBanner();
  showToast(ch.user + ' ' + op + 'd a ' + itemType);
}

async function sendHeartbeat() {
  try {

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: collabUser })
    });

}

// Update the inline gloss below a synset input when the value changes
function updateSenseGloss(input) {
  const gloss = input.closest('.field').querySelector('.sense-gloss');
  if (!gloss) return;
  const ss = input.value ? getSynset(input.value) : null;
  const text = ss && ss.definitions && ss.definitions.length ? ss.definitions[0].gloss : '';
  gloss.textContent = text;
  gloss.style.display = text ? '' : 'none';
}

// Fetch a full entry (handles stub _indexOnly entries in collab mode, or looks up in state)
async function _fetchFullEntry(entryId) {
  let entry = getEntry(entryId);
  if (entry && !entry._indexOnly) return entry;
  if (!collabMode) {
    if (!entry) throw new Error('Entry not found: ' + entryId);
    return entry;
  }
  const r = await _authFetch('/api/entry/' + encodeURIComponent(entryId));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  entry = await r.json();
  delete entry._lock;
  const idx = state.entries.findIndex(e => e.id === entryId);
  if (idx >= 0) state.entries[idx] = entry; else state.entries.push(entry);
  return entry;
}

// Clear the synset field of the sense whose Unlink button was clicked
function unlinkSense(btn) {
  const input = btn.closest('.field').querySelector('.s-synset');
  if (!input) return;
  input.value = '';
  updateSenseGloss(input);
  scheduleAutosave();
}

// Treat current input value as the synset link (called when sense has no synset yet)
function linkSense(btn) {
  const input = btn.closest('.field').querySelector('.s-synset');
  if (!input || !input.value.trim()) { input && input.focus(); return; }
  updateSenseGloss(input);
  scheduleAutosave();
}

// Remove the synset link from an entry's sense (called from Synonyms card)
async function unlinkSynonym(entryId, synsetId) {
  if (!confirm('Remove synset link from entry ' + entryId + '?')) return;
  let entry;
  try { entry = await _fetchFullEntry(entryId); }
  catch (err) { showToast('Could not load entry: ' + err.message, true); return; }
  let changed = false;
  for (const s of entry.senses || []) {
    if (s.synset === synsetId) { s.synset = ''; changed = true; }
  }
  if (!changed) { showToast('No sense found linking to this synset', true); return; }
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed', true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries) {
    ss._nl_entries = ss._nl_entries.filter(e => e.id !== entryId);
  }
  showToast('Synonym link removed');
  _refreshSynonymsCard(synsetId);
}

// Link an entry to this synset (sets its first sense's synset field)
async function addSynonym(synsetId) {
  const input = document.getElementById('syn-add-input');
  const entryId = input ? input.value.trim() : '';
  if (!entryId) { if (input) input.focus(); return; }
  let entry;
  try { entry = await _fetchFullEntry(entryId); }
  catch (err) { showToast('Entry not found: ' + entryId, true); return; }
  if (!entry.senses || !entry.senses.length) {
    showToast('Entry has no senses to link', true); return;
  }
  if (entry.senses.some(s => s.synset === synsetId)) {
    showToast('Entry already linked to this synset'); return;
  }
  entry.senses[0].synset = synsetId;
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed', true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entryId)) {
    ss._nl_entries.push({
      id: entryId,
      lemma: entry.isMWE ? (entry.mweForm || entryId) : (entry.lemma || entryId),
      partOfSpeech: entry.partOfSpeech || ''
    });
  }
  if (input) input.value = '';
  showToast('Synonym linked');
  _refreshSynonymsCard(synsetId);
}

// ── Synonym search modal ──────────────────────────────────────────────

let _ssmState = {};

function openSynSearch(synsetId) {
  _ssmState = { synsetId, query: '' };
  document.getElementById('ssm-overlay').classList.add('open');
  _ssmShowSearch('');
}

function closeSynSearch() {
  document.getElementById('ssm-overlay').classList.remove('open');
}

function _ssmFoot(html) {
  document.getElementById('ssm-foot').innerHTML = html;
}

function _ssmShowSearch(query) {
  _ssmState.query = query;
  document.getElementById('ssm-title').textContent = 'Find word to add as synonym';
  document.getElementById('ssm-body').innerHTML = `
    <input type="text" id="ssm-q" placeholder="Type a written form…"
           value="${h(query)}"
           oninput="_ssmRunSearch(this.value)"
           onkeydown="if(event.key==='Escape')closeSynSearch()"
           style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin-bottom:10px">
    <div id="ssm-results"></div>`;
  _ssmFoot(`<button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
  setTimeout(() => {
    const inp = document.getElementById('ssm-q');
    if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = query.length; }
  }, 20);
  if (query) _ssmRunSearch(query);
}

function _ssmRunSearch(query) {
  _ssmState.query = query;
  const cont = document.getElementById('ssm-results');
  if (!cont) return;
  const q = query.trim().toLowerCase();
  if (!q) {
    cont.innerHTML = '<div style="color:#aaa;font-size:12px;padding:2px 0">Start typing to search entries…</div>';
    return;
  }
  const exact = [], prefix = [], sub = [];
  for (const e of state.entries) {
    const lemma = (e.isMWE ? (e.mweForm || '') : (e.lemma || '')).toLowerCase();
    if (!lemma) continue;
    if (lemma === q)              exact.push(e);
    else if (lemma.startsWith(q)) prefix.push(e);
    else if (lemma.includes(q))   sub.push(e);
  }
  const all = [...exact, ...prefix, ...sub];
  if (all.length === 0) {
    cont.innerHTML = `
      <div style="font-size:13px;color:#555;padding:4px 0">
        No entry found for "<strong>${h(query.trim())}</strong>".
      </div>`;
    _ssmFoot(`
      <button class="btn btn-pri" onclick="_ssmAskCreate(${JSON.stringify(query.trim())})">Create new entry</button>
      <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
    return;
  }
  _ssmFoot(`<button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
  const shown = all.slice(0, 20);
  cont.innerHTML = shown.map(e => {
    const lemma = e.isMWE ? (e.mweForm || e.id) : (e.lemma || e.id);
    return `<div class="ssm-result" onclick="_ssmSelectEntry('${h(e.id)}')">
      <span class="ssm-r-lemma">${h(lemma)}</span>
      <span class="ssm-r-pos">${h(e.partOfSpeech || '')}</span>
      <span class="ssm-r-id">${h(e.id)}</span>
    </div>`;
  }).join('') + (all.length > 20
    ? `<div style="color:#aaa;font-size:11px;padding:6px 2px">…${all.length - 20} more results hidden — type more to narrow down</div>`
    : '');
}

async function _ssmSelectEntry(entryId) {
  document.getElementById('ssm-title').textContent = 'Loading…';
  document.getElementById('ssm-body').innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px 0">Loading entry…</div>';
  _ssmFoot('');
  let entry;
  try { entry = await _fetchFullEntry(entryId); }
  catch (err) {
    document.getElementById('ssm-body').innerHTML =
      `<div style="color:#c00;font-size:12px">Could not load entry: ${h(err.message)}</div>`;
    _ssmFoot(`<button class="btn btn-sec" onclick="_ssmShowSearch(${JSON.stringify(_ssmState.query)})">← Back</button>
              <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
    return;
  }
  _ssmState.entry = entry;
  _ssmShowSenses();
}

function _ssmShowSenses() {
  const { entry, synsetId } = _ssmState;
  const lemma = entry.isMWE ? (entry.mweForm || entry.id) : (entry.lemma || entry.id);
  document.getElementById('ssm-title').textContent = `Senses of "${lemma}"`;
  const senses = entry.senses || [];

  const rows = senses.map((s, i) => {
    const alreadyThis  = s.synset === synsetId;
    const otherSynset  = s.synset && !alreadyThis;
    const def = s.definition || '';
    const ssLabel = alreadyThis
      ? `<span style="color:#27ae60">✓ already linked to this synset</span>`
      : s.synset
      ? `<span style="color:#e67e22">→ ${h(s.synset)} (will be replaced)</span>`
      : `<span style="color:#bbb">no synset</span>`;
    const btn = alreadyThis
      ? `<button class="addbtn" disabled style="opacity:.4;flex-shrink:0">Linked</button>`
      : `<button class="addbtn" style="flex-shrink:0" onclick="_ssmLinkSense(${i})">Select</button>`;
    return `<div class="ssm-sense-row">
      <span class="ssm-sense-num">${h(String(s.senseId || (i + 1)))}</span>
      <div class="ssm-sense-info">
        <div class="ssm-sense-def">${def ? h(def) : '<em style="color:#bbb">no definition</em>'}</div>
        <div class="ssm-sense-ss">${ssLabel}</div>
      </div>
      ${btn}
    </div>`;
  }).join('');

  document.getElementById('ssm-body').innerHTML =
    (rows || '<div style="color:#aaa;font-size:12px;margin-bottom:10px">This entry has no senses yet.</div>') +
    `<button class="addbtn" style="width:100%;justify-content:center;padding:7px;margin-top:6px"
             onclick="_ssmAddNewSense()">+ Add new sense and link to this synset</button>`;

  _ssmFoot(`
    <button class="btn btn-sec" onclick="_ssmShowSearch(${JSON.stringify(_ssmState.query)})">← Back</button>
    <button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
}

async function _ssmLinkSense(senseIdx) {
  const { entry, synsetId } = _ssmState;
  const sense = entry.senses[senseIdx];
  if (sense.synset && sense.synset !== synsetId) {
    if (!confirm(`This sense is already linked to\n${sense.synset}\n\nReplace with ${synsetId}?`)) return;
  }
  sense.synset = synsetId;
  await _ssmSaveEntry(entry);
}

async function _ssmAddNewSense() {
  const { entry, synsetId } = _ssmState;
  const maxId = Math.max(0, ...(entry.senses || []).map(s => parseInt(s.senseId) || 0));
  const ns = makeSense();
  ns.senseId = String(maxId + 1);
  ns.synset  = synsetId;
  entry.senses.push(ns);
  await _ssmSaveEntry(entry);
}

async function _ssmSaveEntry(entry) {
  const { synsetId } = _ssmState;
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'update', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Save failed: HTTP ' + resp.status, true); return; }
    } catch (err) { showToast('Error saving: ' + err.message, true); return; }
  }
  // Keep _nl_entries on the synset up to date
  const ss = getSynset(synsetId);
  const lemma = entry.isMWE ? (entry.mweForm || entry.id) : (entry.lemma || entry.id);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entry.id)) {
    ss._nl_entries.push({ id: entry.id, lemma, partOfSpeech: entry.partOfSpeech || '' });
  }
  showToast('Synonym linked');
  closeSynSearch();
  _refreshSynonymsCard(synsetId);
}

async function _ssmCreateEntry(word) {
  const { synsetId } = _ssmState;
  const pos = document.getElementById('ssm-pos')?.value || 'noun';
  const abbr = { noun:'n', verb:'v', adjective:'a', adverb:'r', other:'o' }[pos] || 'n';
  let n = 1;
  while (state.entries.some(e => e.id === `${word}-${abbr}-${n}`)) n++;
  const entryId = `${word}-${abbr}-${n}`;
  const ns = makeSense();
  ns.senseId = '1';
  ns.synset  = synsetId;
  const entry = {
    id: entryId, lemma: word, partOfSpeech: pos,
    isMWE: false, mweForm: '', mweExpressionType: '', lemmaMode: '', formType: '',
    wordForms: [], relatedForms: [], senses: [ns],
    morphology: { morphoType:'', comparisonType:'', declinable:'', separability:'' },
    morphoSyntax: { pronominalAndGrammaticalGender:'', adverbialUsage:'', position:'', reflexivity:'', auxiliaries:[] },
    syntacticBehaviour: { valency:'', transitivity:'', complementations:[], subcatFrames:[] }
  };
  if (collabMode) {
    try {
      const resp = await _authFetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'add', itemType: 'entry', data: entry, user: collabUser })
      });
      if (!resp.ok) { showToast('Create failed: HTTP ' + resp.status, true); return; }
    } catch (err) { showToast('Error: ' + err.message, true); return; }
  }
  state.entries.unshift(entry);
  const ss = getSynset(synsetId);
  if (ss && ss._nl_entries && !ss._nl_entries.some(e => e.id === entryId)) {
    ss._nl_entries.push({ id: entryId, lemma: word, partOfSpeech: pos });
  }
  showToast(`Entry "${entryId}" created and linked`);
  closeSynSearch();
  rebuildVS();
  _refreshSynonymsCard(synsetId);
}

function _nextOdwn20Id(posAbbr) {
  let max = 0;
  const re = /^odwn-20-(\d+)-[a-z]+$/;
  for (const s of state.synsets) {
    const m = re.exec(s.id);
    if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; }
  }
  return `odwn-20-${String(max + 1).padStart(9, '0')}-${posAbbr}`;
}

    morphology: { morphoType:'', comparisonType:'', declinable:'', separability:'' },
    morphoSyntax: { pronominalAndGrammaticalGender:'', adverbialUsage:'', position:'', reflexivity:'', auxiliaries:[] },

  const synset = {

    monolingualExternalRefs: [],
    _nl_entries: [{ id: entryId, lemma: word, partOfSpeech: pos }]

  if (collabMode) {
    try {
      let resp = await _authFetch('/api/update', {

let _ssrState = { row: null };

function openSSRSearch(btn) {
  _ssrState.row = btn.closest('.ssr-row');
  document.getElementById('ssm-title').textContent = 'Find synset';
  document.getElementById('ssm-body').innerHTML = `
    <div class="irow" style="gap:6px;margin-bottom:10px">
      <input id="ssm-sr-q" type="text" style="flex:1;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px"
             placeholder="Dutch or English synonym…"
             oninput="_ssrRunSearch(this.value)"
             onkeydown="if(event.key==='Escape')closeSynSearch()">
    </div>
    <div id="ssm-sr-results"></div>`;
  _ssmFoot(`<button class="btn btn-sec" style="margin-left:auto" onclick="closeSynSearch()">Cancel</button>`);
  document.getElementById('ssm-overlay').classList.add('open');
  setTimeout(() => { document.getElementById('ssm-sr-q')?.focus(); }, 40);
  _ssrRunSearch('');
}

function _ssrRunSearch(query) {
  const el = document.getElementById('ssm-sr-results');
  if (!el) return;
  const q = query.trim().toLowerCase();
  if (!q) {
    el.innerHTML = '<div style="color:#aaa;font-size:12px;padding:4px 0">Type a Dutch or English word to find synsets…</div>';
    return;
  }

  // Collect hits: synsetId → score. Exact matches score much higher than partial.
  const hits = new Map();
  const bump = (id, n) => hits.set(id, (hits.get(id) || 0) + n);

  // Dutch: scan fully-loaded entries
  for (const e of state.entries) {
    if (e._indexOnly) continue;
    const lemma = (e.isMWE ? e.mweForm : e.lemma) || '';
    const ll = lemma.toLowerCase();
    if (!ll.includes(q)) continue;
    const exact = ll === q;
    for (const s of (e.senses || [])) {
      if (s.synset) bump(s.synset, exact ? 20 : 4);
    }
  }

  // Dutch: also scan _nl_entries on any fully-loaded synsets (collab: set when synset is opened)
  for (const ss of state.synsets) {
    if (!ss._nl_entries) continue;
    for (const e of ss._nl_entries) {
      const ll = (e.lemma || '').toLowerCase();
      if (!ll.includes(q)) continue;
      bump(ss.id, ll === q ? 20 : 4);
    }
  }

  // English: scan enSyns stub field and _en_synonyms if loaded; also match synset ID
  for (const ss of state.synsets) {
    const idL = ss.id.toLowerCase();
    if (idL === q)         bump(ss.id, 30);
    else if (idL.includes(q)) bump(ss.id, 6);

    if (ss._en_synonyms) {
      for (const w of ss._en_synonyms) {
        const wl = w.replace(/_/g, ' ').toLowerCase();
        if (!wl.includes(q)) continue;
        bump(ss.id, wl === q ? 15 : 2);
      }
    } else if (ss.enSyns) {
      for (const w of ss.enSyns.split(' ')) {
        const wl = w.replace(/_/g, ' ').toLowerCase();
        if (!wl.includes(q)) continue;
        bump(ss.id, wl === q ? 15 : 2);
      }
    }
  }

  if (!hits.size) {
    el.innerHTML = '<div style="color:#aaa;font-size:12px;padding:4px 0">No synsets found.</div>';
    return;
  }

  const sorted = [...hits.entries()].sort((a, b) => b[1] - a[1]);
  const shown  = sorted.slice(0, 25);

  let html = '';
  for (const [ssId] of shown) {
    const ss = getSynset(ssId);

    const gloss = (ss && ss.definitions && ss.definitions.length)
      ? ss.definitions[0].gloss
      : (ss && ss.gloss) || '';

    // Dutch synonyms: prefer server-provided _nl_entries, fall back to entry scan
    let nlSyns = [];
    if (ss && ss._nl_entries) {
      nlSyns = ss._nl_entries.map(e => e.lemma);
    } else {
      nlSyns = getSynonymEntries(ssId).map(e => e.lemma);
    }

    // English synonyms
    let enWords = [];
    if (ss && ss._en_synonyms) {
      enWords = ss._en_synonyms.map(w => w.replace(/_/g, ' '));
    } else if (ss && ss.enSyns) {
      enWords = ss.enSyns.split(' ').filter(Boolean).map(w => w.replace(/_/g, ' '));
    }

    html += `<div class="ssr-sr-item" onclick="_ssrSelectSynset(${JSON.stringify(ssId)})">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="ssr-sr-id">${h(ssId)}</div>
          ${nlSyns.length ? `<div class="ssr-sr-nl">NL: ${h(nlSyns.join(', '))}</div>` : ''}
          ${enWords.length ? `<div class="ssr-sr-en">EN: ${h(enWords.slice(0, 8).join(', '))}${enWords.length > 8 ? ' …' : ''}</div>` : ''}
          ${gloss ? `<div class="ssr-sr-gloss">${h(gloss)}</div>` : ''}
        </div>
        <button class="btn btn-pri" style="flex-shrink:0;padding:4px 10px;font-size:11px"
                onclick="event.stopPropagation();_ssrSelectSynset(${JSON.stringify(ssId)})">Select</button>
      </div>
    </div>`;
  }

  if (sorted.length > 25) {
    html += `<div style="color:#aaa;font-size:11px;padding:5px 0">${sorted.length - 25} more — narrow your search.</div>`;
  }
  el.innerHTML = html;
}

function _ssrSelectSynset(synsetId) {

  event.stopPropagation();
  const data = itemType === 'entry' ? getEntry(itemId) : getSynset(itemId);
  const changes = (data && data._changes) || [];
  const popup = document.getElementById('hist-popup');
  document.getElementById('hist-popup-title').textContent =
    (itemType === 'entry' ? 'Entry' : 'Synset') + ' Change History';
  const body = document.getElementById('hist-popup-body');
  if (changes.length === 0) {

  } else {
    body.innerHTML = changes.slice().reverse().map(c => {
      const d = new Date(c.ts * 1000);
      const ds = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      return `<div class="hist-row"><span class="hist-user">${h(c.user)}</span><span class="hist-ts">${ds}</span></div>`;

  }
  const rect = event.currentTarget.getBoundingClientRect();
  popup.style.display = 'block';
  const left = Math.min(rect.left, window.innerWidth - 420);
  popup.style.top  = (rect.bottom + 6) + 'px';
  popup.style.left = Math.max(8, left) + 'px';
}

let _graphExpanded = new Set();
let _graphNodePositions = new Map();

function _synsetLabel(ssId) {
  const syns = getSynonymEntries(ssId);
  if (syns.length) {
    const lemmas = syns.slice(0, 3).map(e => e.lemma || e.id);
    return lemmas.join(', ') + (syns.length > 3 ? ' +' + (syns.length - 3) : '');
  }
  const ss = getSynset(ssId);
  if (ss && ss.definitions.length) {
    const g = ss.definitions[0].gloss || '';
    return g.slice(0, 28) + (g.length > 28 ? '…' : '');
  }
  return ssId.slice(0, 22);
}

function _buildGraphData(rootId) {
  const MAX_PER_NODE = 8;
  const nodes = new Map();
  const edgeKeys = new Set();
  const edges = [];

  const addNode = (id, depth) => {
    if (!nodes.has(id)) nodes.set(id, { id, label: _synsetLabel(id), depth });
    else if (nodes.get(id).depth > depth) nodes.get(id).depth = depth;
  };
  const addEdge = (from, to, relType, extra) => {
    const key = `${from}→${to}→${relType}`;
    if (edgeKeys.has(key)) return;
    edgeKeys.add(key);
    edges.push(Object.assign({ from, to, relType }, extra));
  };

  addNode(rootId, 0);
  const queue = [{ id: rootId, depth: 0 }];
  const processed = new Set();

  while (queue.length) {
    const { id, depth } = queue.shift();
    if (processed.has(id)) continue;
    processed.add(id);

    const shouldExpand = depth < 2 || _graphExpanded.has(id);
    if (!shouldExpand) continue;

    const ss = getSynset(id);
    if (!ss || ss._indexOnly) continue;

    const rels = ss.synsetRelations || [];
    const shown = depth === 0 ? rels : rels.slice(0, MAX_PER_NODE);

    for (const r of shown) {
      if (r.target === rootId && depth > 0) { addEdge(id, r.target, r.relType); continue; }
      addNode(r.target, depth + 1);
      addEdge(id, r.target, r.relType);
      if (!processed.has(r.target)) queue.push({ id: r.target, depth: depth + 1 });
    }

    if (depth > 0 && rels.length > MAX_PER_NODE && !_graphExpanded.has(id)) {
      const moreId = '__more_' + id;
      nodes.set(moreId, { id: moreId, label: '+' + (rels.length - MAX_PER_NODE) + ' more',
        depth: depth + 1, isMore: true, parentId: id });
      addEdge(id, moreId, '__more__', { isMore: true });
    }
  }

  const validIds = new Set(nodes.keys());
  return { nodes: [...nodes.values()], edges: edges.filter(e => validIds.has(e.from) && validIds.has(e.to)) };
}

function _initPositions(nodes, edges, W, H) {
  const cx = W / 2, cy = H / 2;
  const byDepth = {};
  for (const n of nodes) (byDepth[n.depth] = byDepth[n.depth] || []).push(n);

  // Depth 0 at center
  if (byDepth[0]) { byDepth[0][0].x = cx; byDepth[0][0].y = cy; }

  // Build parent map for guided init
  const parentOf = {};
  for (const e of edges) {
    const src = nodes.find(n => n.id === e.from);
    const tgt = nodes.find(n => n.id === e.to);
    if (src && tgt && tgt.depth === src.depth + 1 && !parentOf[tgt.id]) parentOf[tgt.id] = src;
  }

  // Depth 1: evenly around root
  const d1 = byDepth[1] || [];
  d1.forEach((n, i) => {
    const a = (i / d1.length) * 2 * Math.PI - Math.PI / 2;
    n.x = cx + 150 * Math.cos(a); n.y = cy + 150 * Math.sin(a); n._angle = a;
  });

  // Depth 2+: near parent
  for (const [depth, dnodes] of Object.entries(byDepth)) {
    if (+depth < 2) continue;
    const R = 140 + (+depth) * 120;
    const byParent = {};
    for (const n of dnodes) {
      const par = parentOf[n.id];
      const pk = par ? par.id : '__none__';
      (byParent[pk] = byParent[pk] || []).push(n);
    }
    for (const [pk, children] of Object.entries(byParent)) {
      const par = nodes.find(n => n.id === pk);
      const baseAngle = par?._angle ?? 0;
      const arc = par ? (2 * Math.PI / Math.max(d1.length, 1) * 0.7) : 2 * Math.PI;
      children.forEach((n, j) => {
        const a = baseAngle - arc / 2 + (children.length > 1 ? j / (children.length - 1) : 0.5) * arc;
        n.x = cx + R * Math.cos(a); n.y = cy + R * Math.sin(a); n._angle = a;
      });
    }
  }
}

function _forceLayout(nodes, edges, W, H) {
  _initPositions(nodes, edges, W, H);
  if (nodes.length < 2) return;
  const cx = W / 2, cy = H / 2;

  const REPEL = 6000, K = 130, GRAVITY = 0.01, ATTRACT = 0.008;
  let T = 55;

  for (let iter = 0; iter < 220; iter++) {
    const fx = new Float64Array(nodes.length);
    const fy = new Float64Array(nodes.length);
    const idx = new Map(nodes.map((n, i) => [n.id, i]));

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        const d2 = dx * dx + dy * dy + 1;
        const f = REPEL / d2;
        fx[i] -= f * dx; fy[i] -= f * dy;
        fx[j] += f * dx; fy[j] += f * dy;
      }
    }

    for (const e of edges) {
      const si = idx.get(e.from), ti = idx.get(e.to);
      if (si === undefined || ti === undefined) continue;
      const dx = nodes[ti].x - nodes[si].x, dy = nodes[ti].y - nodes[si].y;
      const d = Math.hypot(dx, dy) + 0.01;
      const f = ATTRACT * (d - K * (1 + nodes[ti].depth * 0.3));
      fx[si] += f * dx; fy[si] += f * dy;
      fx[ti] -= f * dx; fy[ti] -= f * dy;
    }

    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].depth === 0) continue;
      fx[i] -= GRAVITY * (nodes[i].x - cx);
      fy[i] -= GRAVITY * (nodes[i].y - cy);
      const mag = Math.hypot(fx[i], fy[i]) || 1;
      const step = Math.min(mag, T);
      nodes[i].x += fx[i] / mag * step;
      nodes[i].y += fy[i] / mag * step;
    }
    T *= 0.955;
  }

  const PAD = 48;
  for (const n of nodes) {
    n.x = Math.max(PAD, Math.min(W - PAD, n.x));
    n.y = Math.max(PAD, Math.min(H - PAD, n.y));
  }
}

function _wrapLabel(text, maxCh) {
  const words = text.split(/[\s,]+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words) {
    if (lines.length >= 2) break;
    const next = cur ? cur + ' ' + w : w;
    if (next.length > maxCh && cur) { lines.push(cur); cur = w.length > maxCh ? w.slice(0, maxCh - 1) + '…' : w; }
    else cur = next.length > maxCh ? next.slice(0, maxCh - 1) + '…' : next;
  }
  if (cur && lines.length < 2) lines.push(cur);
  if (!lines.length) lines.push(text.slice(0, maxCh));
  return lines;
}

function renderSynsetGraph(ssId) {
  dismissNodePopup();
  hideNodeTooltip();
  const container = document.getElementById('sg-container');
  if (!container) return;

  const W = 780, H = 480;
  const { nodes, edges } = _buildGraphData(ssId);

  if (!nodes.length) { container.innerHTML = '<div class="empty-msg" style="padding:12px">No relations found.</div>'; return; }

  _forceLayout(nodes, edges, W, H);
  _graphNodePositions = new Map(nodes.map(n => [n.id, { x: n.x, y: n.y }]));

  const nodeMap = new Map(nodes.map(n => [n.id, n]));
  const relTypes = [...new Set(edges.filter(e => !e.isMore).map(e => e.relType))];

  const nodeR = n => n.depth === 0 ? 48 : (n.isMore ? 20 : (n.depth === 1 ? 36 : 24));
  const nodeFill  = n => n.depth === 0 ? '#1a1a2e' : (n.isMore ? '#c8d6e0' : (n.depth === 1 ? '#4f8ef7' : '#8ab4d4'));
  const nodeTC    = n => n.depth <= 1 && !n.isMore ? '#fff' : '#333';
  const nodeSW    = n => _graphExpanded.has(n.id) ? 3 : 2;
  const nodeSC    = n => _graphExpanded.has(n.id) ? '#f39c12' : '#fff';

  // SVG marker defs (one per unique relType)
  const encRT = rt => 'a' + rt.replace(/[^a-zA-Z0-9]/g, '_');
  const defs = relTypes.map(rt =>
    `<marker id="${encRT(rt)}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="${REL_COLOR(rt)}" opacity="0.85"/>
    </marker>`
  ).join('');

  // Edges
  let edgesSVG = '';
  for (const e of edges) {
    const src = nodeMap.get(e.from), tgt = nodeMap.get(e.to);
    if (!src || !tgt) continue;
    const color = e.isMore ? '#bbb' : REL_COLOR(e.relType);

    const mx = (src.x + tgt.x) / 2, my = (src.y + tgt.y) / 2;
    const dx = tgt.x - src.x, dy = tgt.y - src.y;
    const len = Math.hypot(dx, dy) || 1;
    const perp = Math.min(28, len * 0.18);
    const cpx = mx - (dy / len) * perp, cpy = my + (dx / len) * perp;

    const rT = nodeR(tgt) + 2;
    const tdx = tgt.x - cpx, tdy = tgt.y - cpy, tl = Math.hypot(tdx, tdy) || 1;
    const tx = tgt.x - (tdx / tl) * rT, ty = tgt.y - (tdy / tl) * rT;

    const rS = nodeR(src) + 2;
    const sdx = cpx - src.x, sdy = cpy - src.y, sl = Math.hypot(sdx, sdy) || 1;
    const sx = src.x + (sdx / sl) * rS, sy = src.y + (sdy / sl) * rS;

    const t = 0.5;
    const lx = (1-t)*(1-t)*sx + 2*(1-t)*t*cpx + t*t*tx;
    const ly = (1-t)*(1-t)*sy + 2*(1-t)*t*cpy + t*t*ty - 4;

    const sw = tgt.depth <= 1 ? 1.8 : 1.2;
    const dash = tgt.depth >= 2 ? '5,3' : 'none';
    const markerAttr = e.isMore ? '' : `marker-end="url(#${encRT(e.relType)})"`;
    const clickTarget = tgt.isMore ? `graphExpandMore(event,'${h(tgt.parentId)}','${h(ssId)}')` : `event.stopPropagation();graphToggleExpand('${h(tgt.id)}','${h(ssId)}')`;

    edgesSVG += `<g class="sg-edge" onclick="${clickTarget}" style="cursor:pointer" title="${h(e.relType)}: ${h(e.to)}">
      <path d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${cpx.toFixed(1)},${cpy.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)}"
        fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash}" ${markerAttr}/>
      <path d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${cpx.toFixed(1)},${cpy.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)}"
        fill="none" stroke="transparent" stroke-width="10"/>
      ${e.isMore ? '' : `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="8.5"
        fill="${color}" font-weight="500" font-family="system-ui,sans-serif"
        paint-order="stroke" stroke="#f6f9ff" stroke-width="2.5" style="pointer-events:none">${h(e.relType)}</text>`}
    </g>`;
  }

  // Nodes
  let nodesSVG = '';
  for (const n of nodes) {
    const r = nodeR(n);
    const maxCh = Math.max(3, Math.floor(r * 1.7 / 6.5));
    const lines = n.isMore ? [n.label] : _wrapLabel(n.label, maxCh);
    const fsize = n.depth === 0 ? 13 : (n.depth === 1 ? 11.5 : 10);
    const fw = n.depth <= 1 ? '600' : '400';
    const tc = nodeTC(n);

    const lh = fsize * 1.25;
    const txtHTML = lines.length >= 2
      ? `<text x="${n.x.toFixed(1)}" y="${(n.y - lh * 0.5 + 1).toFixed(1)}" text-anchor="middle" font-size="${fsize}" font-weight="${fw}" fill="${tc}" font-family="system-ui,sans-serif" style="pointer-events:none">${h(lines[0])}</text>
         <text x="${n.x.toFixed(1)}" y="${(n.y + lh * 0.5 + 1).toFixed(1)}" text-anchor="middle" font-size="${fsize}" font-weight="${fw}" fill="${tc}" font-family="system-ui,sans-serif" style="pointer-events:none">${h(lines[1])}</text>`
      : `<text x="${n.x.toFixed(1)}" y="${(n.y + fsize * 0.38).toFixed(1)}" text-anchor="middle" font-size="${fsize}" font-weight="${fw}" fill="${tc}" font-family="system-ui,sans-serif" style="pointer-events:none">${h(lines[0] || n.id.slice(0,14))}</text>`;

    let clickAttr = '';
    if (n.depth === 0) {
      clickAttr = '';
    } else if (n.isMore) {
      clickAttr = `onclick="graphExpandMore(event,'${h(n.parentId)}','${h(ssId)}')"`;
    } else {
      clickAttr = `onclick="showNodePopup(event,'${h(n.id)}','${h(ssId)}')"`;
    }

    const ttAttr = n.isMore ? '' : `onmouseenter="showNodeTooltip(event,'${h(n.id)}')" onmouseleave="hideNodeTooltip()"`;
    nodesSVG += `<g class="sg-node" ${clickAttr} ${ttAttr} style="cursor:${n.depth === 0 ? 'default' : 'pointer'}">
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${nodeFill(n)}" stroke="${nodeSC(n)}" stroke-width="${nodeSW(n)}"/>
      ${txtHTML}
    </g>`;
  }

  const legendHTML = relTypes.map(rt =>
    `<div class="sg-li"><div class="sg-sw" style="background:${REL_COLOR(rt)}"></div>${h(rt)}</div>`
  ).join('');

  container.innerHTML =
    `<svg id="sg-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${H}px" onclick="dismissNodePopup()">
      <defs>${defs}</defs>
      <g id="sg-pan">
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="pointer-events:all"/>
        ${edgesSVG}
        ${nodesSVG}
      </g>
    </svg>
    ${relTypes.length ? `<div class="sg-legend">${legendHTML}</div>` : ''}`;

  _attachGraphPan('sg-svg');
}

function _attachGraphPan(svgId) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  let drag = false, ox = 0, oy = 0, tx = 0, ty = 0;
  svg.addEventListener('mousedown', e => {
    if (e.target.closest('.sg-node') || e.target.closest('.sg-edge')) return;
    dismissNodePopup();
    drag = true; ox = e.clientX - tx; oy = e.clientY - ty; svg.style.cursor = 'grabbing';
  });
  const onMove = e => {
    if (!drag) return;
    tx = e.clientX - ox; ty = e.clientY - oy;
    const g = document.getElementById('sg-pan');
    if (g) g.setAttribute('transform', `translate(${tx},${ty})`);
  };
  const onUp = () => { if (drag) { drag = false; const s = document.getElementById(svgId); if (s) s.style.cursor = 'grab'; } };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  svg.style.cursor = 'grab';
}

function showNodePopup(event, nodeId, rootId) {
  event.stopPropagation();
  hideNodeTooltip();
  dismissNodePopup();

  const svg = document.getElementById('sg-svg');
  const wrap = svg && svg.closest('.sg-wrap');
  if (!svg || !wrap) return;

  const pos = _graphNodePositions.get(nodeId);
  if (!pos) return;

  // Read current pan offset
  const panG = document.getElementById('sg-pan');
  let panX = 0, panY = 0;
  if (panG) {
    const m = (panG.getAttribute('transform') || '').match(/translate\(([^,]+),([^)]+)\)/);
    if (m) { panX = +m[1]; panY = +m[2]; }
  }

  // Convert viewBox coords → viewport (fixed) coordinates
  const svgRect = svg.getBoundingClientRect();
  const W = 780, H = 480;
  const scaleX = svgRect.width / W, scaleY = svgRect.height / H;

  const screenX = svgRect.left + (pos.x + panX) * scaleX;
  const screenY = svgRect.top  + (pos.y + panY) * scaleY;

  const isExp = _graphExpanded.has(nodeId);

  const popup = document.createElement('div');
  popup.id = 'sg-node-popup';
  popup.style.left = (screenX - 74) + 'px';
  popup.style.top  = (screenY - 64) + 'px';

  const expBtn = document.createElement('button');
  expBtn.textContent = isExp ? 'Collapse' : 'Expand';
  expBtn.style.background = isExp ? '#fff3e0' : '#eef3ff';
  expBtn.style.color      = isExp ? '#e67e22' : '#4f8ef7';
  expBtn.onclick = e => { e.stopPropagation(); graphToggleExpand(nodeId, rootId); };

  const centerBtn = document.createElement('button');
  centerBtn.textContent = 'Make center';
  centerBtn.style.background = '#eafaf1';
  centerBtn.style.color      = '#1d8348';
  centerBtn.onclick = e => { e.stopPropagation(); graphMakeCenter(nodeId); };

  popup.appendChild(expBtn);
  popup.appendChild(centerBtn);
  document.body.appendChild(popup);
}

function dismissNodePopup() {
  document.getElementById('sg-node-popup')?.remove();
}
document.addEventListener('click', e => {
  if (e.target.closest('#sg-node-popup')) return;
  dismissNodePopup();
});

async function _ensureSynsetLoaded(id) {
  if (!collabMode) return;
  const ss = getSynset(id);
  if (!ss || !ss._indexOnly) return;
  try {
    const resp = await _authFetch('/api/synset/' + encodeURIComponent(id));
    if (!resp.ok) return;
    const full = await resp.json();
    delete full._lock;
    const idx = state.synsets.findIndex(s => s.id === id);
    if (idx >= 0) state.synsets[idx] = full; else state.synsets.push(full);
  } catch (_) {}
}

async function graphToggleExpand(nodeId, rootId) {
  if (_graphExpanded.has(nodeId)) {
    _graphExpanded.delete(nodeId);
  } else {
    _graphExpanded.add(nodeId);
    await _ensureSynsetLoaded(nodeId);
  }
  dismissNodePopup();
  renderSynsetGraph(rootId);
}

function graphMakeCenter(nodeId) {
  jumpToSynset(nodeId);
}

async function graphExpandMore(event, parentId, rootId) {
  event.stopPropagation();
  _graphExpanded.add(parentId);
  await _ensureSynsetLoaded(parentId);
  renderSynsetGraph(rootId);
}

function showNodeTooltip(event, nodeId) {
  const syns = getSynonymEntries(nodeId);
  const ss   = getSynset(nodeId);

  let html = `<div class="sg-tt-id">${h(nodeId)}</div>`;

  if (syns.length) {
    html += `<div class="sg-tt-syns">${h(syns.map(e => e.lemma || e.id).join(', '))}</div>`;
  }

  const glosses = ss ? ss.definitions.map(d => d.gloss).filter(Boolean) : [];
  if (glosses.length) {
    html += glosses.map(g => `<div class="sg-tt-gloss">${h(g)}</div>`).join('');
  }

  if (!syns.length && !glosses.length) {
    html += `<div class="sg-tt-syns">${h(nodeId)}</div>`;
  }

  let tip = document.getElementById('sg-tooltip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'sg-tooltip'; document.body.appendChild(tip); }
  tip.innerHTML = html;
  tip.style.display = 'block';
  _positionTooltip(event, tip);
}

function _positionTooltip(event, tip) {
  const pad = 16, vw = window.innerWidth, vh = window.innerHeight;
  let x = event.clientX + pad, y = event.clientY - pad;
  tip.style.left = '0'; tip.style.top = '0'; // reset so offsetWidth is accurate
  const tw = tip.offsetWidth || 260, th = tip.offsetHeight || 80;
  if (x + tw > vw - 8) x = event.clientX - tw - pad;
  if (y + th > vh - 8) y = event.clientY - th - pad;
  tip.style.left = Math.max(4, x) + 'px';
  tip.style.top  = Math.max(4, y) + 'px';
}

function hideNodeTooltip() {
  const tip = document.getElementById('sg-tooltip');
  if (tip) tip.style.display = 'none';
}

function resetSynsetGraph(ssId) {
  _graphExpanded.clear();
  renderSynsetGraph(ssId);
}

// =====================================================================
// INIT
// =====================================================================

renderAll();
initCollab();
</script>
